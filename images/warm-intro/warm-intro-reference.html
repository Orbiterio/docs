let order=['avery','sarah'],activeStep=0,editorTab='edit',reviewed=new Set(),currentView=query.get('view')||'setup',recipientStage=query.get('state')||'first',recipientNotice='',emailStep=Number(query.get('email')||0),historyFilter='all',historySearch='',detailId=query.get('detail')||null,started=false;
const drafts={avery:{subject:'Avery, would you like to meet Sarah?',body:'Hi Avery,\n\nI’d love to introduce you to Sarah Chen at Northline Ventures. She invests in creative software and works closely with founders on product and go-to-market.\n\nFieldwork’s next chapter feels well aligned with her experience. I think you’d have a useful conversation about what you’re building and the partners who could help.\n\nWould you be open to an introduction?\n\nMark'},sarah:{subject:'Sarah, would you like to meet Avery?',body:'Hi Sarah,\n\nI’d love to introduce you to Avery Stone, the founder of Fieldwork. Avery is building software that helps independent creative teams run their work.\n\nYour focus on creative software and hands-on support for early-stage founders made me think of you. There’s a thoughtful product here, and I think you’d enjoy comparing notes.\n\nWould you be open to an introduction?\n\nMark'},final:{subject:'Introducing Avery Stone and Sarah Chen',body:'Avery, meet Sarah. Sarah, meet Avery.\n\nThank you both for being open to connecting.\n\nAvery is building Fieldwork, software for independent creative teams. Sarah invests in creative software at Northline Ventures and brings a hands-on perspective on product and go-to-market.\n\nI thought you’d have a useful conversation about Fieldwork’s next chapter and the opportunities ahead. I’ll leave it to you to find a time to connect.\n\nOver to you both!\nMark'}};

function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatar(p,size=''){return `<span class="avatar ${p.id||''} ${size}" aria-hidden="true">${esc(p.initials)}</span>`}
function first(){return people[order[0]]}function second(){return people[order[1]]}function key(){return activeStep===2?'final':order[activeStep]}
function brand(){return '<span class="brand"><span class="orb" aria-hidden="true"></span>orbiter<span style="font-weight:400;opacity:.7">.io</span></span>'}
function header(){return `<header class="app-header"><div class="row">${brand()}<span class="crumb">Leverage Loop <span aria-hidden="true">/</span> <b>Warm introduction</b></span></div><div class="row"><button class="quiet" data-action="save-close">Save & close</button><button class="quiet" data-action="history">Warm introductions</button>${avatar({initials:'MP',id:'mark'},'small')}</div></header>`}

function ask(title,copy,confirmLabel,onConfirm,cancelLabel='Keep editing'){const d=document.getElementById('confirm-dialog');document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-copy').textContent=copy;const c=document.getElementById('dialog-cancel');c.textContent=cancelLabel;c.onclick=()=>d.close();document.getElementById('dialog-confirm').textContent=confirmLabel;document.getElementById('dialog-confirm').onclick=()=>{d.close();onConfirm()};d.showModal()}
function navigate(view){currentView=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();window.scrollTo(0,0)}
function render(){if(currentView==='setup')renderSetup();else if(currentView==='recipient')renderRecipient();else if(currentView==='emails')renderEmails();else if(currentView==='source')renderSource();else renderHistory()}
function renderSource(){app.innerHTML=`<header class="app-header">${brand()}<button data-action="source-history">Warm introductions</button></header><section class="workspace" style="max-width:1000px"><div class="eyebrow">Leverage Loop</div><h1 style="margin:16px 0 24px">Introduce Avery Stone to Sarah Chen</h1><div class="why"><div class="row" style="margin-bottom:18px">${avatar(people.avery)}<strong>Avery Stone</strong><span class="muted">↔</span>${avatar(people.sarah)}<strong>Sarah Chen</strong></div><h3>Creative tools, with the right early partner.</h3><p>Avery is building Fieldwork for creative teams. Sarah’s focus on creative software and founder support makes this a promising conversation.</p></div><div class="email-action" style="margin-top:20px"><strong>Double Opt-In Warm Introduction</strong><button class="primary" data-action="resume">${started?'View introduction':'Resume warm introduction'} →</button></div><p class="small muted" style="margin-top:16px">Design preview · This represents the originating suggestion.</p></section>`;app.querySelector('[data-action="resume"]').onclick=()=>{if(started){detailId='current';navigate('tracking')}else navigate('setup')};app.querySelector('[data-action="source-history"]').onclick=()=>{detailId=null;navigate('tracking')}}
function renderSetup(){
 if(started){detailId='current';navigate('tracking');return}
 const k=key(),p=people[k],d=drafts[k],count=reviewed.size;
 app.innerHTML=`${header()}<section class="workspace"><div class="hero"><div><div class="eyebrow">From your Leverage Loop <span style="color:#48627f;padding:0 7px">/</span> Double opt-in</div><h1>Introduce Avery & Sarah</h1><p class="muted">Review the messages, choose who goes first, and start the introduction.</p></div><div class="pair">${avatar(people.avery)}<span class="muted" aria-hidden="true">↔</span>${avatar(people.sarah)}</div></div><div class="composer-grid"><aside class="context"><div class="why"><div class="eyebrow">Why this introduction</div><h3>Creative tools, with the right early partner.</h3><p>Avery is building Fieldwork for creative teams. Sarah’s focus on creative software and founder support makes this a promising conversation.</p><details><summary>View the suggestion context</summary><p>Both are already in your contacts. The suggestion connects Avery’s next stage of growth with Sarah’s experience helping early-stage software founders. This private context guides the drafts; recipients see only the messages you review.</p></details></div><section class="sequence"><h3>The introduction sequence</h3><p class="explanation">All three messages are drafted together.</p><div class="sequence-buttons">${[0,1,2].map(i=>{const rk=i===2?'final':order[i],isReviewed=reviewed.has(rk);return `<button class="sequence-step ${activeStep===i?'active':''} ${isReviewed?'done':''}" data-step="${i}" aria-current="${activeStep===i?'step':'false'}"><span class="step-number">${isReviewed?'✓':i+1}</span><span><span class="step-name">${i===2?'Introduce them':`Ask ${esc(people[order[i]].first)}`}</span><small>${i===0?'Sends when you start':i===1?`Only if ${esc(first().first)} accepts`:'Only after both accept'}</small><span class="draft-status">${isReviewed?'Reviewed':'Ready to review'}</span></span></button>`}).join('')}</div></section><div class="order-card"><div class="row between"><strong class="small">${esc(first().first)} is asked first</strong>${order[0]==='avery'?'<span class="pill amber">Suggested</span>':''}</div><p>${order[0]==='avery'?'Avery has the closer relationship with you.':'You changed the order. Sarah will receive the first request.'}</p><button data-action="swap">↔ Ask ${esc(second().first)} first instead</button></div><p class="privacy-note"><span aria-hidden="true">◇</span><span>Contact details are shared only after both people agree.</span></p></aside><div><section class="composer"><header class="composer-top"><div class="row between"><span class="pill blue">Message ${activeStep+1} of 3</span><span class="small muted">${reviewed.has(k)?'✓ Reviewed':'AI draft · Ready to edit'}</span></div><h2>${activeStep===2?'The final introduction':`Ask ${esc(p.first)} about meeting ${esc(people[order[1-activeStep]].first)}`}</h2><p>${activeStep===0?`Only ${esc(first().first)} receives this when you start.`:activeStep===1?`This sends automatically after ${esc(first().first)} accepts.`:'One shared email connects them after both accept.'}</p><div class="editor-tabs" aria-label="Draft view"><button data-editor="edit" class="${editorTab==='edit'?'active':''}" aria-pressed="${editorTab==='edit'}">Edit message</button><button data-editor="preview" class="${editorTab==='preview'?'active':''}" aria-pressed="${editorTab==='preview'}">Preview email</button>${activeStep!==2?'<button data-action="preview-recipient">Preview public page ↗</button>':''}</div></header>${editorTab==='edit'?`<div class="editor"><div class="recipient"><span class="small muted">To</span>${activeStep===2?`${avatar(people.avery,'small')}<strong>Avery</strong><span class="small muted">${esc(people.avery.email)}</span><span class="muted">+</span>${avatar(people.sarah,'small')}<strong>Sarah</strong><span class="small muted">${esc(people.sarah.email)}</span>`:`${avatar(p,'small')}<label><strong>${esc(p.name)}</strong><input aria-label="${esc(p.first)}’s email address" type="email" value="${esc(p.email)}" id="recipient-email" /></label>`}</div><label class="field"><span>Subject</span><input id="subject" maxlength="160" value="${esc(d.subject)}" /></label><label class="field"><span>${activeStep===2?'Introduction message':'Your personal note'}</span><textarea id="message" maxlength="3000">${esc(d.body)}</textarea><span class="helper">${activeStep===2?'Both people receive this exact message in the same email thread.':'Used in the email and the public invitation page. Edit once, review both.'}</span></label>${activeStep===2?'<div class="email-action"><strong>To Avery + Sarah · Mark copied</strong><small>Replies connect everyone</small></div>':'<div class="email-action"><strong>Review introduction →</strong><small>Button added to the email automatically</small></div>'}</div>`:`<div class="composer-preview">${emailCard(activeStep,false)}</div>`}<footer class="editor-bottom"><span class="review-note">${reviewed.has(k)?'✓ This message is reviewed':'Check the names, context, and tone.'}</span><button data-action="review">${reviewed.has(k)?(activeStep<2?'Next message →':'Reviewed ✓'):(activeStep<2?'Mark reviewed & next →':'Mark reviewed ✓')}</button></footer></section><div class="launch-bar"><div class="launch-copy"><strong id="review-count">${count} of 3 messages reviewed</strong><span>${esc(first().first)} first → ${esc(second().first)} → introduction, if both accept.</span></div><button class="primary" data-action="launch" ${count<3?'disabled':''}>Make the warm intro <span aria-hidden="true">→</span></button></div><p class="small muted" style="margin-top:12px;text-align:right">${started?'This sequence has already started. Open Warm introductions to track it.':'Starting authorizes this sequence. Later messages wait for consent.'}</p></div></div></section>`;
 bindSetup();
}
function bindSetup(){app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{activeStep=+b.dataset.step;editorTab='edit';renderSetup()});app.querySelectorAll('[data-editor]').forEach(b=>b.onclick=()=>{editorTab=b.dataset.editor;renderSetup()});
 const sub=document.getElementById('subject'),body=document.getElementById('message'),email=document.getElementById('recipient-email');
 function changed(){reviewed.delete(key());document.getElementById('review-count').textContent=`${reviewed.size} of 3 messages reviewed`;app.querySelector('[data-action="launch"]').disabled=true;const step=app.querySelector('.sequence-step.active');step.classList.remove('done');step.querySelector('.step-number').textContent=activeStep+1;step.querySelector('.draft-status').textContent='Edited · Review again';app.querySelector('.review-note').textContent='Edited since last review.';app.querySelector('[data-action="review"]').textContent=activeStep<2?'Mark reviewed & next →':'Mark reviewed ✓'}
 if(sub)sub.oninput=()=>{drafts[key()].subject=sub.value;changed()};if(body)body.oninput=()=>{drafts[key()].body=body.value;changed()};if(email)email.oninput=()=>{people[key()].email=email.value;reviewed.delete('final');changed()};
 app.querySelector('[data-action="review"]').onclick=()=>{const d=drafts[key()];if(!d.subject.trim()||!d.body.trim()){notify('Add a subject and message before marking this reviewed.');return}if(activeStep<2&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(people[key()].email)){notify('Choose a valid email address for this person.');return}reviewed.add(key());if(activeStep<2)activeStep++;editorTab='edit';renderSetup()};
 app.querySelector('[data-action="swap"]').onclick=()=>{order.reverse();reviewed.clear();activeStep=0;editorTab='edit';renderSetup();notify(`Now asking ${first().first} first. Your edits are preserved; review the new sequence.`)};
 app.querySelector('[data-action="save-close"]').onclick=()=>{navigate('source');notify('Draft kept for this preview. Refreshing resets it.')};app.querySelector('[data-action="history"]').onclick=()=>{detailId=null;navigate('tracking')};const pp=app.querySelector('[data-action="preview-recipient"]');if(pp)pp.onclick=()=>{recipientStage=activeStep===0?'first':'second';navigate('recipient')};
 app.querySelector('[data-action="launch"]').onclick=()=>{if(started){detailId='current';navigate('tracking');return}if(reviewed.size!==3)return;if(people.avery.email.trim().toLowerCase()===people.sarah.email.trim().toLowerCase()){notify('Choose a different email address for each person.');return}started=true;const current=histories.find(h=>h.id==='current');Object.assign(current,{state:'first',first:first().first,second:second().first,updated:'Just now'});detailId='current';navigate('tracking');notify(`Preview: request queued for ${first().first}. No email was sent.`)};
}
function personalNote(p){const full=drafts[p.id].body;return full.replace(/^Hi [^,]+,\s*/,'').replace(/\s*Mark\s*$/,'')}
function renderRecipient(){
 const isSecond=recipientStage==='second'||recipientStage==='accepted-second';const recipient=isSecond?second():first(),other=isSecond?first():second();
 let content='';
 if(['first','second'].includes(recipientStage))content=`<div class="public-content"><div class="row">${avatar({initials:'MP',id:'mark'},'small')}<div class="from"><strong>Mark Pederson</strong>has someone in mind for you</div></div><h1>${esc(recipient.first)}, meet<br>${esc(other.first)}.</h1><p class="intro-copy">${isSecond?`${esc(other.first)} is open to connecting. Mark thought you’d have a lot to talk about.`:'A personal introduction, if it feels right for you.'}</p><section class="public-profile"><div class="row">${avatar(other,'large')}<div><h2>${esc(other.name)}</h2><p class="role">${esc(other.role)}</p></div></div><p class="pitch">${esc(other.blurb)}</p><div class="tags">${other.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></section><div class="personal-note"><div class="eyebrow">A note from Mark</div><p class="note-text">${esc(personalNote(recipient))}</p></div><details><summary>What happens if I say yes?</summary><p>${isSecond?'You’ll both receive Mark’s introduction email. It will include your names and email addresses so you can reply to each other.':`We’ll ask ${esc(other.first)} next. If you both agree, you’ll receive one introduction email together, sharing your names and email addresses.`}</p></details></div><div class="consent-block"><p>${isSecond?'Saying yes shares your name and email with '+esc(other.first)+' in the introduction email.':'Your email stays private until you both agree to connect.'}</p><button class="primary" data-action="accept">Yes, introduce me</button><button class="secondary" data-action="decline">No, thank you</button></div>`;
 else if(recipientStage==='decline')content=`<div class="public-state"><div class="state-icon" aria-hidden="true">—</div><h1>Not the right fit?</h1><p>That’s completely fine. Mark will know you’re passing on this introduction.</p><label for="decline-note">A private note for Mark <span style="font-weight:400">(optional)</span><textarea id="decline-note" placeholder="Not a good time for me, but thank you for thinking of me." maxlength="500"></textarea></label><p class="note-privacy">Your note won’t be shared with the other person.</p><button class="primary" data-action="confirm-decline">Decline introduction</button><button data-action="back-invitation">Back to the invitation</button></div>`;
 else if(recipientStage==='declined')content=publicResult('—','Thanks for letting Mark know.','This introduction won’t go ahead. Your contact details haven’t been shared.','Your response is saved','You can close this page. Your private note, if added, is only for Mark.');
 else if(recipientStage==='accepted-first')content=publicResult('✓','You’re open to it.','We’ll ask '+second().first+' next. If they agree, you’ll both receive Mark’s introduction email.','Waiting for '+second().first,'Your email address stays private until you both agree. No further action needed.');
 else if(recipientStage==='accepted-second')content=publicResult('✓','You’ve both said yes.','Mark’s introduction email is being prepared for you both. You can continue the conversation by replying to that email.','Your introduction is on its way','We’ll show the sent confirmation here when it’s ready.');
 else if(recipientStage==='introduced')content=publicResult('✓','You’re introduced.','Mark’s introduction email has been sent to you both. Reply there to take the next step.','Check your inbox','Look for “'+drafts.final.subject+'” from Mark Pederson via Orbiter.');
 else if(recipientStage==='expired')content=publicResult('—','This invitation has expired.','Your contact details haven’t been shared. If you’d still like to connect, ask Mark to send a new invitation.','No response was recorded','This page can no longer accept a decision.');
 else if(recipientStage==='cancelled')content=publicResult('—','This introduction is closed.','Mark has closed this invitation. There’s nothing you need to do.','Your contact details stay private','This page can no longer accept a decision.');
 else content=publicResult('↻','We couldn’t save your response.','Your decision hasn’t been recorded. Please check your connection and try again.','You’re still in control','Opening this page never counts as accepting.')+'<div class="consent-block"><button class="primary" data-action="retry-response">Try again</button></div>';
 app.innerHTML=`<section class="phone-stage"><article class="phone" aria-label="Public introduction invitation"><header class="public-header">${brand()}<small>Personal introduction</small></header>${content}<footer class="public-footer">No Orbiter account needed · Sent with care by Mark</footer></article><aside class="public-note"><div class="eyebrow" style="color:#5e737b;margin-bottom:10px">Recipient experience</div><h2>One decision.<br>No account required.</h2><p>The email opens this private invitation. Opening the page does not accept it.</p><label for="public-state-select">Explore a state</label><select id="public-state-select">${[['first','First person · Invitation'],['second','Second person · Invitation'],['accepted-first','First person · Accepted'],['accepted-second','Both accepted · Preparing email'],['introduced','Introduction sent'],['decline','Decline · Optional private note'],['declined','Decline recorded'],['expired','Expired link'],['cancelled','Cancelled invitation'],['error','Response could not be saved']].map(([v,l])=>`<option value="${v}" ${v===recipientStage?'selected':''}>${l}</option>`).join('')}</select><button data-action="back-setup">← Back to setup</button><p style="margin-top:20px;font-size:11px">Design preview. People, companies, and messages are illustrative. Decisions stay in this page only.</p></aside></section>`;
 const sel=document.getElementById('public-state-select');sel.onchange=()=>{recipientStage=sel.value;renderRecipient()};app.querySelector('[data-action="back-setup"]').onclick=()=>navigate('setup');
 const accept=app.querySelector('[data-action="accept"]');if(accept)accept.onclick=()=>{const current=histories.find(h=>h.id==='current');current.state=isSecond?'introducing':'second';recipientStage=isSecond?'accepted-second':'accepted-first';renderRecipient();window.scrollTo(0,0);if(isSecond)setTimeout(()=>{if(current.state==='introducing'){current.state='introduced';if(currentView==='recipient'&&recipientStage==='accepted-second'){recipientStage='introduced';renderRecipient()}else if(currentView==='tracking')renderHistory()}},1800)};
 const decline=app.querySelector('[data-action="decline"]');if(decline)decline.onclick=()=>{recipientNotice=recipientStage;recipientStage='decline';renderRecipient()};
 const cd=app.querySelector('[data-action="confirm-decline"]');if(cd)cd.onclick=()=>{const item=histories.find(h=>h.id==='current');item.state=recipientNotice==='second'?'declined-second':'declined-first';item.privateNote=document.getElementById('decline-note').value;recipientStage='declined';renderRecipient();window.scrollTo(0,0)};
 const back=app.querySelector('[data-action="back-invitation"]');if(back)back.onclick=()=>{recipientStage=recipientNotice||'first';renderRecipient()};const retry=app.querySelector('[data-action="retry-response"]');if(retry)retry.onclick=()=>{recipientStage=recipientNotice||'first';renderRecipient()};
}
function publicResult(icon,title,copy,label,detail){return `<div class="public-state"><div class="state-icon" aria-hidden="true">${icon}</div><h1>${esc(title)}</h1><p>${esc(copy)}</p><div class="state-detail"><strong>${esc(label)}</strong>${esc(detail)}</div></div>`}
function emailCard(step,envelope=true){const d=step<2?drafts[order[step]]:drafts.final;const recipient=step<2?people[order[step]].name:'Avery Stone, Sarah Chen';const closure=step===3;return `<article class="mini-email">${envelope?`<div class="mail-envelope"><div><strong>From</strong> Mark Pederson via Orbiter</div><div><strong>To</strong> ${esc(closure?first().name:recipient)}${step===2?' · <strong>Cc</strong> Mark Pederson':''}</div><div><strong>Subject</strong> ${esc(closure?'An update on your introduction':d.subject)}</div></div>`:''}${brand()}<h2>${closure?'An update from Mark':step===2?'Avery, meet Sarah.':`A personal introduction from Mark.`}</h2>${step===1?`<p class="small muted" style="margin-bottom:18px">${esc(first().first)} is open to connecting. Now it’s your choice.</p>`:''}<div class="mail-body">${esc(closure?`Hi ${first().first},\n\nThis introduction won’t be going ahead this time. Thank you for being open to it. Your contact details haven’t been shared.\n\nMark`:d.body)}</div>${step<2?'<button class="mail-cta" data-action="email-open">Review introduction →</button><p class="small muted">See who Mark has in mind, then say yes or no.<br>No account needed. No response until you choose.</p>':''}<div class="email-foot">${step===2?'You both agreed to this introduction. Reply all to continue the conversation.':closure?'Sent on behalf of Mark Pederson. No further action needed.':'Sent on behalf of Mark Pederson. Your email will only be shared if you both agree.'}</div></article>`}
function renderEmails(){app.innerHTML=`<section class="email-stage"><aside class="email-selector"><div class="eyebrow">Communications</div>${[`01 · Ask ${first().first}`,`02 · Ask ${second().first}`,'03 · Introduce both','Closure · No introduction'].map((n,i)=>`<button class="${i===emailStep?'active':''}" data-email="${i}">${esc(n)}<small>${i===0?'When Mark starts':i===1?'After the first acceptance':i===2?'After both accept':'If a pending introduction closes'}</small></button>`).join('')}<p style="font-size:11px;color:#526878;margin:20px 10px">Invitation notes mirror the public page. Delivery is planned through Resend; this preview sends nothing.</p></aside>${emailCard(emailStep)}</section>`;app.querySelectorAll('[data-email]').forEach(b=>b.onclick=()=>{emailStep=+b.dataset.email;renderEmails()});const open=app.querySelector('[data-action="email-open"]');if(open)open.onclick=()=>{recipientStage=emailStep===0?'first':'second';navigate('recipient')}}
function stateInfo(h){const map={first:[`Waiting for ${h.first}`,'blue',`${h.second} hasn’t been contacted`,0],second:[`Waiting for ${h.second}`,'blue',`${h.first} accepted · Next request sent`,1],introducing:['Sending introduction','amber','Both accepted · Delivery in progress',2],introduced:['Introduced','green','Both accepted · Introduction sent',3],'declined-first':['Declined','red',`${h.first} declined · ${h.second} not contacted`,-1],'declined-second':['Declined','red',`${h.first} accepted · ${h.second} declined`,-2],expired:['Expired','',`No response from ${h.first}`,0],cancelled:['Cancelled','',`Closed by you · No introduction sent`,0],delivery:['Delivery issue','red',`Request to ${h.first} could not be delivered`,0],draft:['Draft','',`Messages not yet reviewed`,0]};return map[h.state]||map.first}
function renderHistory(){app.innerHTML=`<section class="history-bg"><div class="row between background-copy">${brand()}<span class="small">Your network, in motion.</span></div><section class="history-shell" role="dialog" aria-modal="true" aria-label="Warm introductions history">${detailId?historyDetail(histories.find(h=>h.id===detailId)||histories[0]):historyList()}</section></section>`;bindHistory();const initial=app.querySelector('.history-shell button');if(initial)initial.focus({preventScroll:true})}
function historyList(){let list=histories.filter(h=>historyFilter==='all'||(historyFilter==='active'&&['first','second','introducing','delivery'].includes(h.state))||(historyFilter==='introduced'&&h.state==='introduced')||(historyFilter==='closed'&&['declined-first','declined-second','cancelled','expired'].includes(h.state))||(historyFilter==='drafts'&&h.state==='draft')).filter(h=>(h.names+' '+h.why).toLowerCase().includes(historySearch.toLowerCase()));return `<header class="history-header"><div class="row between"><div><h1>Warm introductions</h1><p class="small muted">The connections you’re making, from the first ask to the final introduction.</p></div><button class="close" data-action="close-history" aria-label="Close warm introductions">×</button></div></header><div class="history-controls"><div class="filters" aria-label="Filter introductions">${[['all','All'],['active','In progress'],['introduced','Introduced'],['closed','Closed'],['drafts','Drafts']].map(([v,l])=>`<button class="${historyFilter===v?'active':''}" data-filter="${v}" aria-pressed="${historyFilter===v}">${l}</button>`).join('')}</div><input class="search" type="search" value="${esc(historySearch)}" placeholder="Search people or context" aria-label="Search introductions" /></div><div class="history-labels"><span>Introduction</span><span>Current stage</span><span>Updated</span><span></span></div><div id="history-results" aria-live="polite">${list.length?list.map(h=>{const [label,color,stage,n]=stateInfo(h);return `<div class="history-row"><div class="row"><span class="duo">${avatar({initials:h.a})}${avatar({initials:h.b,id:'sarah'})}</span><div><div class="names">${esc(h.names)}</div><p class="purpose">${esc(h.why)}</p></div></div><div class="history-status"><span class="pill ${color}">${esc(label)}</span><div class="stage-lines" aria-hidden="true">${[0,1,2].map(i=>`<span class="${(n>i||(n===-2&&i===0))?'complete':n<0&&(i===(-n-1))?'stopped':n===i&&!['draft','cancelled','expired','delivery'].includes(h.state)?'current':''}"></span>`).join('')}</div><div class="stage-text">${esc(stage)}</div></div><time>${esc(h.updated)}</time><button class="view-row" data-detail="${h.id}" aria-label="View ${esc(h.names)}">↗</button></div>`}).join(''):'<div class="empty"><h3>No introductions here yet.</h3><p>Try another filter or search.</p></div>'}</div><footer class="history-footer"><span>${list.length} introductions · Sorted by latest activity</span><span>Introduced = both accepted and the final email was sent</span></footer>`}
function historyDetail(h){const [label,color,stage,n]=stateInfo(h),pastFirst=(n>=1||h.state==='declined-second'||h.priorState==='second'),isActive=['first','second','introducing','delivery'].includes(h.state),notContacted=['first','declined-first','delivery','draft'].includes(h.state);const introCopy=h.state==='introduced'?'The introduction was sent to both people. They can continue by replying to that email.':h.state==='second'?`${h.first} said yes. ${h.second} has received the invitation. Their contact details remain private until both agree.`:h.state==='first'?`The first request is with ${h.first}. ${h.second} won’t be contacted unless they accept.`:h.state==='introducing'?'Both people agreed. The final email is being sent; this is not marked Introduced until sending is confirmed.':h.state==='delivery'?'The first request could not be delivered. The sequence is paused. No one else has been contacted.':h.state==='draft'?'This introduction has not started. Its messages still need review.':'The sequence is closed. No further invitations or introduction email will be sent.';
return `<header class="history-header"><button class="quiet" data-action="back-history" style="padding-left:0;margin-bottom:10px">← All introductions</button><div class="row between"><div><h1>${esc(h.names)}</h1><p class="small muted">${esc(h.why)}</p></div><span class="pill ${color}">${esc(label)}</span></div></header><div class="detail-grid"><section class="detail-pane"><div class="detail-banner"><h3>${esc(label)}</h3><p>${esc(introCopy)}</p></div><h3>Sequence activity</h3><ol class="timeline"><li class="done"><span class="dot">✓</span><div><strong>Introduction ${h.state==='draft'?'drafted':'started'}</strong><p>${h.state==='draft'?'Not sent':`Messages reviewed · ${h.first} first`}</p></div></li><li class="${pastFirst?'done':'now'}"><span class="dot">${pastFirst?'✓':'1'}</span><div><strong>${esc(h.first)} · ${h.state==='declined-first'?'Declined':pastFirst?'Accepted':h.state==='delivery'?'Delivery failed':h.state==='draft'?'Not contacted':'Request sent'}</strong><p>${pastFirst?'Permission to proceed recorded':h.state==='delivery'?'Check the address before retrying':h.state==='draft'?'Waiting for you to start':h.state==='cancelled'?'Sequence cancelled':h.state==='expired'?'Invitation expired':h.state==='declined-first'?'Sequence stopped':'Awaiting response'}</p></div></li><li class="${n>=2?'done':h.state==='second'?'now':''}"><span class="dot">${n>=2?'✓':'2'}</span><div><strong>${esc(h.second)} · ${n>=2?'Accepted':h.state==='declined-second'?'Declined':notContacted?'Not contacted':h.state==='second'?'Request sent':h.state==='cancelled'&&h.priorState==='second'?'Request cancelled':'Not completed'}</strong><p>${n>=2?'Permission to proceed recorded':h.state==='declined-second'?'The sequence stopped here':notContacted?'Waits for the first acceptance':'No contact details shared yet'}</p></div></li><li class="${n===3?'done':n===2?'now':''}"><span class="dot">${n===3?'✓':'3'}</span><div><strong>${n===3?'Introduction sent':n===2?'Sending introduction':'Final introduction'}</strong><p>${n===3?'One shared email · Both people connected':n===2?'Both accepted · Waiting for sending confirmation':isActive?'Waits for both people to accept':h.state==='draft'?'Will wait for both acceptances':'Not sent'}</p></div></li></ol>${isActive&&h.state!=='introducing'?'<button class="quiet danger" data-action="cancel-intro">Cancel introduction</button>':''}</section><section class="detail-pane"><h3>Communication record</h3><p class="small muted" style="margin:8px 0 17px">Approved copy, preserved with this introduction.</p>${h.id==='current'?[0,1,2].map(i=>`<details><summary>${i===0?`Request to ${esc(h.first)}`:i===1?`Request to ${esc(h.second)}`:'Final introduction'} <span class="muted">· ${i===0?'Sent':i===1&&!notContacted?'Sent':n===3?'Sent':'Waiting'}</span></summary><p>${esc(drafts[i===2?'final':order[i]].subject)}\n\n${esc(drafts[i===2?'final':order[i]].body)}</p></details>`).join(''):'<p class="small muted" style="padding:18px 0">Illustrative history item. Message copy is available for Avery & Sarah in this design preview.</p>'}<div class="why-small"><strong>From your Leverage Loop</strong>${esc(h.why)}<p style="margin-top:9px">Your private relationship context stays in Orbiter.</p></div>${h.state==='declined-second'||h.state==='declined-first'?'<div class="detail-banner"><h3>Private response</h3><p>'+esc(h.privateNote||'No note was added.')+' The other person sees only that this introduction is not going ahead.</p></div>':''}</section></div>`}
function bindHistory(){const modal=app.querySelector('.history-shell');if(modal){modal.onkeydown=e=>{if(e.key==='Escape'){detailId=null;navigate('source')}if(e.key==='Tab'){const els=[...modal.querySelectorAll('button,input,summary,select,textarea,a[href]')].filter(el=>!el.disabled&&el.getClientRects().length);const firstEl=els[0],lastEl=els[els.length-1];if(e.shiftKey&&document.activeElement===firstEl){e.preventDefault();lastEl.focus()}else if(!e.shiftKey&&document.activeElement===lastEl){e.preventDefault();firstEl.focus()}}};} const close=app.querySelector('[data-action="close-history"]');if(close)close.onclick=()=>navigate('source');app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{historyFilter=b.dataset.filter;renderHistory()});const search=app.querySelector('.search');if(search)search.oninput=()=>{const pos=search.selectionStart;historySearch=search.value;renderHistory();const again=app.querySelector('.search');again.focus();try{again.setSelectionRange(pos,pos)}catch{}};app.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{detailId=b.dataset.detail;renderHistory()});const back=app.querySelector('[data-action="back-history"]');if(back)back.onclick=()=>{detailId=null;renderHistory()};const cancel=app.querySelector('[data-action="cancel-intro"]');if(cancel)cancel.onclick=()=>ask('Cancel this introduction?','Future messages will stop. Messages already sent cannot be recalled. Anyone who has already accepted will receive a short closure note.','Cancel introduction',()=>{const item=histories.find(h=>h.id===detailId);item.priorState=item.state;item.state='cancelled';renderHistory();notify('Preview: introduction cancelled. No email was sent.')},'Keep it going')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='tracking')detailId=null;navigate(b.dataset.view)});
navigate(currentView);
</script>
</body>
</html>
