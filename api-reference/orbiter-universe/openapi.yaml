          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: The `meta.next_before` cursor of the previous page.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of ledger rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonorsEdgesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
