          type: integer
          description: Filed for a human (reason ambiguous_soft_match).
        deferred:
          type: integer
          description: A step whose provider is not wired yet (bake-off pending); the sweep retries.
        cap_deferred:
          type: integer
          description: Search skipped because ENRICHMENT_FILINGS_990_MAX_NEW_PERSONS_PER_RUN was reached.
        unresolved:
          type: integer
        persons_created:
          type: integer
          description: Leaves minted on a LinkedIn key (tier-4 queue row, no dispatch).
        searches:
          type: integer
        adjudications:
          type: integer
    FilingsGovernanceCounts:
      type: object
