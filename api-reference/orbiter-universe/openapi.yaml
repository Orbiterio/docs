  /v1/admin/enrichment/queue/{id}/drain:
    post:
      operationId: drainQueueRow
      tags:
        - Enrichment
      summary: Run one queue row now, with no timer involved (management plane)
      description: |
        Drives a single queue row through its orchestrator immediately. This exists because a timed drain cannot be smoke-tested — it picks its own row and its own moment, and the requirement before enabling the crons is one run at a time with the cascade ledger checked after each. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants it: the call spends provider credit and can create entities. Three deliberate differences from the timed drain. The **priority tier is ignored**, because the timed drain takes tier <= 1 and most discovered titles land at 2-4, so a tier-gated smoke test would drain nothing and read as convergence. The **lane flags are ignored**, since driving a row by hand is what those flags shipping false is for. The **entity cap is NOT ignored** — it is the outermost brake, and a blocked row is released rather than left locked so it stays drivable once the cap clears. Depth and cascade root always come from the ROW, never from the caller: a row that ran as a fresh root would get its own full fanout allowance. `outcome` is the one word to read: `drained`, `failed`, `over_depth`, `cap_blocked`, `not_wired`, or `not_eligible` (missing, already locked, or dead-lettered — the three are deliberately not distinguished, since telling them apart would mean claiming a row we never held). `over_depth` is the one outcome that DELETES the row: a row past the cascade ceiling is not work waiting for a better moment, and running it would cascade further from a level that already escaped its bound. An operator cannot wave it through.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The enrichment_queue row id, not the entity id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            What the drive did. A failed run is a 200 with `outcome: failed`, not a 5xx — the row was reached and released, which is an outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualDrainEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/adaptations:
    post:
      operationId: runStageAdaptations
      tags:
        - Enrichment
      summary: Run one whole adaptation pass — both discoveries, the BASED_ON replay and the re-describe (management plane)
      description: |
        The adaptation lane (stage D51, D52). Wikidata decides the edge. Stage side: each unchecked production is matched to its work item (a stage-work class, the same title, a first performance in the production's opening year, so only an ORIGINAL production matches), then the films that item lists as derivative works or that name it as their source (P4969 / P144) with an IMDb id are minted through the film gate, and the films the work is itself based on (its P144) are minted and filed production → film (D53). Film side: each unchecked film's own item names the works it is based on; a screen source is minted through the film gate and filed film → film, a stage source is matched to the original production we hold, else admitted from the registry page a grounded model call locates (behind `STAGE_LLM_ENABLED`), else kept as a lead — never invented. Every Wikidata read is ledgered verbatim and one `based_on` claim lands on each DERIVATIVE. The replay draws `BASED_ON` (derivative → source, weight 55, evidence layer, excluded from scoring) for a claim the derivative's distill has ELECTED whose two nodes exist, with the description contract's sentence; the re-describe upgrades a deterministic sentence to the model's, three tries each. The replay rides the credit-edge tick; the whole pass answers the `enrichment.stage_adaptations_requested` event. **Management plane, staff only.** Discovery needs `STAGE_ADAPTATION_ENABLED`; the replay fails closed without `STAGE_EDGE_WRITES_ENABLED`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: What the pass did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      discovery:
                        type: object
                        properties:
                          productions:
                            type: integer
                          works:
                            type: integer
                          derivatives:
                            type: integer
                          sources:
                            type: integer
                          leads:
                            type: integer
                          skipped:
                            type: integer
                          failed:
                            type: integer
                        required:
                          - productions
                          - works
                          - derivatives
                          - sources
                          - leads
                          - skipped
                          - failed
                      films:
                        type: object
                        properties:
                          films:
                            type: integer
                          sources:
                            type: integer
                          minted:
                            type: integer
                          leads:
                            type: integer
                          skipped:
                            type: integer
                          failed:
                            type: integer
                        required:
                          - films
                          - sources
                          - minted
                          - leads
                          - skipped
                          - failed
                      replay:
                        type: object
                        properties:
                          claimed:
                            type: integer
                          drawn:
                            type: integer
                          pending:
                            type: integer
                          failed:
                            type: integer
                        required:
                          - claimed
                          - drawn
                          - pending
                          - failed
                      redescribe:
                        type: object
                        properties:
                          claimed:
                            type: integer
                          rewritten:
                            type: integer
                          pending:
                            type: integer
                          failed:
                            type: integer
                        required:
                          - claimed
                          - rewritten
                          - pending
                          - failed
                    required:
                      - discovery
                      - films
                      - replay
                      - redescribe
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                  - data
                  - error
                  - meta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/awards:
    post:
      operationId: replayStageAwards
      tags:
