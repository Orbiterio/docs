  /v1/backfill/graph/purge-entity:
    post:
      operationId: purgeEntity
      tags:
        - Graph
      summary: Purge ONE entity's rows and graph nodes
      description: |
        Operator-only, DESTRUCTIVE. The targeted counterpart of `/graph/wipe`: that one selects by label or entity_type and runs in bounded batches, this one names a single `entity_id` and runs to completion. `target` reuses the same vocabulary — `nodes` (default), `tables`, `all`.

        **The id set is the target plus its merge tombstones.** Every entity whose `merged_into` chain reaches the target is purged with it (transitively): that FK is NO ACTION and would otherwise block the delete. Their merge history is gone permanently, and they are listed in `tombstones_purged`.

        **Graph teardown is ledger-driven, not label-driven.** The entity's own node is DETACH DELETEd; then every satellite node the write-back ledgers name (funding_rounds, film_tv_awards, and the person certification / honor / project / publication nodes) is deleted ONLY if it has no edge left. That degree test is what keeps a shared node alive: a certification is one node for everyone who holds it, and an award node is shared by the film and the winner. Survivors are counted in `satellites_kept`. The investor's `InvestmentThesis` node is keyed by the thesis id, which no ledger names, so it is taken by `investor_uuid` and counted in `thesis_nodes_deleted`.

        **The purge edits OTHER entities.** `entity_facts.value_entity_id` CASCADEs, so a surviving entity's relation fact to the target dies; sixteen FKs SET NULL, so surviving rows keep their raw provider string but lose the resolved id (a colleague's `person_work_experience.company_entity_id`, a `master_persons.current_company_entity_id`, a round investor). Both are counted in `collateral` — run with `dry_run: true` first to see them without deleting.

        Seeded reference rows and nodes always survive, and the music support tables (release, place) are never touched: they belong to no entity. Requires `confirm: true` unless `dry_run` is set, and an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_id:
                  type: string
                  format: uuid
                  description: The entity to purge. Not resolved through merged_into — the id given is the id purged.
                confirm:
                  type: boolean
                  const: true
                  description: |
                    Must be true, and is REQUIRED unless `dry_run` is set — a dry run writes nothing, so demanding confirmation there would only train reflexive `confirm: true`.
                target:
                  type: string
                  enum:
                    - nodes
                    - tables
                    - all
                  description: |
                    What dies. REQUIRED — unlike `/graph/wipe`, where an omitted scope means "everything non-reference", this call names one live row, so what it deletes must be stated rather than defaulted. Required on a dry run too: a dry run reports what WOULD die, so it must say what.
                dry_run:
                  type: boolean
                  description: Compute and return every count without deleting anything.
              required:
                - entity_id
                - target
              if:
                properties:
                  dry_run:
                    const: true
                required:
                  - dry_run
              else:
                properties:
                  confirm:
                    const: true
                required:
                  - confirm
      responses:
        '200':
          description: Purge summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResultEnvelope'
              examples:
                selfContainedPerson:
                  summary: A person nobody else referenced — collateral all zero
                  description: |
                    The normal result. Every collateral counter is zero because no surviving entity pointed at this person. Zeros are the answer, not a missing feature.
                  value:
                    data:
                      entity_id: 01a05d26-8e8f-7e6c-bf82-7721c5ddd45d
                      entity_type: person
                      target: all
                      dry_run: false
                      tombstones_purged: []
                      nodes_deleted: 1
                      edges_deleted: 0
                      satellites_deleted: 0
                      satellites_kept: 0
                      thesis_nodes_deleted: 0
                      entity_links_cleared: 1
                      address_links_cleared: 0
                      round_links_cleared: 0
                      music_links_cleared: 0
                      rows_deleted: 1
                      entities_deleted: 1
                      game_entities_purged: []
                      game_roots_deleted: 0
                      collateral:
                        relation_facts_deleted: 0
                        shared_awards_deleted: 0
                        references_nulled: 0
                        by_table:
                          person_work_experience: 0
                          person_education: 0
                          master_persons: 0
                          funding_round_investors: 0
                          funding_round_partners: 0
                          person_certification: 0
                          person_honor: 0
                          person_publication: 0
                          person_volunteering: 0
                    error: null
                    meta:
                      requestId: 1efc7bc3-cb52-4095-9a20-06d9029dbc36
                companyWithCollateral:
                  summary: A company 12 people worked at — collateral populated
                  description: |
                    Those 12 job rows SURVIVE with their company_name string intact; only the resolved company_entity_id is nulled. The 12 works_at relation facts are deleted outright. Two employees also had this company as their current employer on the typed cache. One certification issued by the company loses its issuer id.
                  value:
                    data:
                      entity_id: 01a05d37-e20f-7675-9c28-43057b77a5b8
                      entity_type: company
                      target: all
