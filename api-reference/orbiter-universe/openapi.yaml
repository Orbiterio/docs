                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                  - data
                  - error
                  - meta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/productions:
    post:
      operationId: admitStageProduction
      tags:
        - Enrichment
      summary: Admit one Broadway / West End production (management plane)
      description: |
        Runs one typed source production reference through the stage admission gate — the same gate automated discovery uses — and reports what it decided. ORBIT-1863, slice 2. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants it: an admission can create a canonical `stage_production` entity and queue paid work. The gate records a durable admission (a `stage_source_job` row), resolves the canonical production through the entities feature (an `ibdb`, `theatricalia` or registry-keyed source mints or finds the hub; a directory id such as `broadwayworld` only nominates and is `refused` until a reviewer maps it), ensures the control row, then decides the queue: `p0`/`p1` queue at drain tiers 0/1, `p2` is `parked` in the historical inventory, `if_due` keeps a fresh production `fresh_existing`, and a production already on the queue is `already_pending`. **202 only after a durable admission** (`queued` or `parked`). Every other decision is a 200 carrying its `action` and `reason` — `awaiting_dependency` when intake, the market or the source is disabled, `refused` when the cap, the per-root budget or the depth ceiling says no. A contradictory existing mapping (the record already names a person or a compound credit) is a 409. `dry_run: true` predicts the action and performs no write, provider call, entity creation or queue mutation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageAdmitRequest'
      responses:
        '200':
          description: A decision that recorded nothing new, or a dry run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageAdmitEnvelope'
        '202':
          description: A durable admission — the production is queued or parked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageAdmitEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The source record already maps to a different kind of entity, or is a compound credit that cannot be one production.
        '500':
          $ref: '#/components/responses/Internal'
