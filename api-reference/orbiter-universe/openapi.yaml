              schema:
                $ref: '#/components/schemas/StageMentionsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/mentions/{id}/review:
    post:
      operationId: reviewStageMention
      tags:
        - Enrichment
      summary: Accept, reject or revoke one credit mention's identity (management plane)
      description: |
        The reviewer's half of Stage B. `accept` names the canonical person or company and links the mention as `review_linked` with confidence 1; the entity must be a person or company and must match the billed candidate type. `reject` closes the mention without an entity. `revoke` withdraws an accepted link back to `unresolved`, so the ladder may run again on new evidence. Every decision is fenced on `expected_identity_revision`, the revision the reviewer saw: a stale review is a 409, never a silent overwrite. The decision is appended to the mention's attempt history under step `review` with the reviewer as actor, and an accept raises the production's facts obligation. **Management plane, staff only.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
