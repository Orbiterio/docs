openapi: 3.1.0
info:
  title: Orbiter Universe API
  version: 0.1.0
  description: |
    The consumer-facing contract of the Orbiter Universe backend. Every caller is a registered client (the Orbiter App backend, self-hosted App backends, tooling) authenticating with an API key. Every response carries the canonical entity id — a merged id resolves through the merge chain and the response echoes the requested id.
servers:
  - url: https://universe.orbiter.io
security:
  - bearerAuth: []
tags:
  - name: Entities
    description: Canonical entity reads and identifier resolution.
  - name: Enrichment
    description: |
      Data-plane enrichment triggers: the company get-or-create entry gate (scope enrich:company) and the person one (enrich:person). The two scopes are independent.
  - name: Projections
    description: |
      Versioned packages consumers read and upsert from. Row-derived projections carry an entity's attributes; the graph-derived subgraph projection carries its relationships, including edge types that have no backing row. Graph search finds ids a consumer does not yet hold; graph paths says how two entities connect.
  - name: Persona
    description: |
      Data-plane persona work: the persona build trigger (scope persona:build), synthetic archetype builds (synthetic_personas:build), person-to-person and archetype-to-person compares (personas:compare), and leverage loops (leverage_loops:run). The four scopes are independent. Builds and loops run in a worker, so their triggers answer 202 with what they set in motion (200 when a fresh persona already exists); compares and GET reads return results.
  - name: Graph
    description: |
      Operator-only graph seeding and FalkorDB ops. Staff only (WorkOS role `admin`); no scope grants this. Not part of the consumer contract — self-hosted clients never call these.
  - name: Admin
    description: |
      Management plane: client registry, scope replacement, API-key lifecycle and entity merge review. Staff only (WorkOS role `admin`); no scope grants this. Not part of the consumer contract — self-hosted clients never call these.
  - name: Agents
    description: |
      Management plane for the agentic enrichment tier: re-drive stalled Deep Bio jobs, or research one person again on purpose. Staff-only (WorkOS role admin, no scope grants them) because each call can spend provider credit. Not part of the consumer contract — an agent's output leaves through the publish projections like any other fact.
paths:
  /v1/entities/{id}:
    get:
      operationId: getEntity
      tags:
        - Entities
      summary: Get the canonical entity for an id
      description: |
        Resolves the id through the merge chain (merged_into) and returns the living canonical row. The response id may differ from the requested id — consumers must overwrite stored references with the returned id. Requires scope `read:entity`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The canonical entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/entities/{id}/projection:
    get:
      operationId: getEntityProjection
      tags:
        - Projections
      summary: Get the versioned projection for a company, person, stage production or video game
      description: |
        Returns `company_projection.v1`, `person_projection.v1`, `stage_production_projection.v1` or `video_game_projection.v1` depending on the entity type — the versioned envelope consumers apply idempotently to their own storage. Check `schema_version` to tell them apart. The id resolves through the merge chain first; the `universe_*_uuid` in the body is always the canonical id, and it is also the graph node id. `run_id` is deterministic per (entity, source state): re-pulling unchanged data yields the same run_id, so consumer re-applies are natural no-ops. Returns 404 until a company has been distilled, and — for a person — until enrichment has completed SUCCESSFULLY: a person whose run is still pending or settled-failed is deliberately not emitted. A stage production answers 404 until its profile is distilled, and in a deployment whose `STAGE_PUBLISH_ENABLED` gate is closed. A video game (including a legacy `film_tv` row the game waterfall owns) answers 404 until its publication is promoted; the body served is the one frozen at promotion, so a refresh in flight never leaks. Requires scope `projections:pull`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The projection package.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CompanyProjectionEnvelope'
                  - $ref: '#/components/schemas/PersonProjectionEnvelope'
                  - $ref: '#/components/schemas/StageProductionProjectionEnvelope'
                  - $ref: '#/components/schemas/VideoGameProjectionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/entities/{id}/subgraph:
    get:
      operationId: getEntitySubgraph
      tags:
        - Projections
      summary: Get an entity and its directly connected neighbours from the graph
      description: |
        Returns the entity plus everything one hop away, as nodes and edges copied verbatim from the graph, for a consumer to write into its own graph unchanged.
        This projection is derived from the graph, not from Postgres rows. The row-derived projections carry only what has rows; several edge types have none, FOUNDED among them, so a consumer that rebuilds relationships from those loses them with no error.
        Geography and expertise are excluded by default; include_reference_nodes opts into these direct neighbors for answer context. Tombstoned nodes are always excluded. A node reached by several edges is returned once.
        Only edges incident to the anchor are returned. An edge between two neighbours belongs to their own neighbourhoods.
        Node and edge properties are returned verbatim and are deliberately untyped: the same key carries different types across labels, so updated_at is a string on Person and an integer on Company.
        Embeddings are returned as arrays of numbers. A consumer must re-wrap them as vectors on write, or its vector index will not see them and search will silently return nothing.
        404 until the entity's first node write has landed. Write the nodes before the edges. An edge write matches its two endpoints, so running it first drops every edge with no error and no warning, leaving a node set that looks complete and has no relationships.
        Requires scope `subgraph:read`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Entity id. Resolved through the merge chain first.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: |
            Maximum neighbours returned. The anchor is always included and does not count toward it.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: include_embeddings
          in: query
          required: false
          description: |
            Vectors dominate the payload at roughly 107KB per node. A consumer that needs structure only should turn them off; one that intends to search must keep them, since they are generated here once and are never regenerated downstream.
          schema:
            type: boolean
            default: true
        - name: include_reference_nodes
          in: query
          description: Include direct geography and expertise neighbors for answer context. Defaults to false for graph-copy consumers.
          schema:
            type: boolean
            default: false
        - name: paginate
          in: query
          description: Use bounded pages ordered by neighbor UUID. Follow next_cursor until absent.
          schema:
            type: boolean
            default: false
        - name: after
          in: query
          description: Previous next_cursor. Requires paginate=true; omit for the first page.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The entity and its one-hop neighbourhood.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubgraphEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/graph/search:
    post:
      operationId: searchGraph
      tags:
        - Projections
      summary: Find graph nodes by meaning
      description: |
        Returns the nodes nearest the query, each with its one-hop edges, in the same node/edge shape as the subgraph projection.
        The counterpart to the subgraph read: that one needs an id you already hold, this one is how you find an id you do not. The query is embedded server-side with the same model that wrote the node vectors — vectors from two models are not comparable, so a consumer cannot supply its own vector.
        score is a DISTANCE: lower is closer, and 0 would be identical. Matched nodes carry it and sort first; a node pulled in by expansion has score null and is_match false. Relevance is cut both absolutely and relative to the best hit, so a query with one good answer returns one node no matter what limit says — limit is an upper bound, not a page size, and there is no pagination.
        Geography and expertise are excluded by default. Set include_reference_nodes to include these direct neighbors as answer context. Tombstoned nodes are always excluded.
        A client with entity-type entitlements is narrowed to those types automatically; asking only for types it may not read is a 403, not an empty result. Neighbours are not filtered by entity type — a match's surroundings describe it, and cutting them would misdescribe it.
        Requires scope `graph:search`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphSearchRequest'
      responses:
        '200':
          description: |
            The matched nodes and their one-hop edges. An empty nodes array means nothing was close enough, which is a normal answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSearchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/graph/paths:
    post:
      operationId: findGraphPaths
      tags:
        - Projections
      summary: Find how source entities reach a target entity
      description: |
        Returns the best route from each source entity to the target, one path per source that can reach it.
        Ids are entity ids, not graph node uuids: an entity id is what a consumer stores, and it resolves through the merge chain. Every path echoes both the canonical and the requested source id so a stored reference can be healed.
        Fewest hops wins per source; ties and ordering across sources go by total_weight, where LOWER is stronger — the weight scale is a distance, so paths come back strongest first.
        Geography and expertise are excluded from every route: both are hubs that connect everyone to everyone, so a path through one is not a connection anybody can act on. This is policy, not an option.
        A source with no route within max_hops is listed in unreachable_source_entity_ids. One that could not be traversed at all — unknown to Universe, or not yet written to the graph — is listed in skipped_source_entity_ids instead, and never silently dropped. 404 means the TARGET is not in the graph yet.
        Entitlements are checked on the target only. An interior node is part of how two entities connect, not something the response hands over: it carries a name and type, never a property bag.
        Requires scope `graph:paths`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphPathsRequest'
      responses:
        '200':
          description: |
            One path per reachable source, strongest first, plus what could not be reached or traversed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPathsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/companies/get-add:
    post:
      operationId: getAddCompany
      tags:
        - Enrichment
      summary: Get-or-create a company (the enrichment entry gate)
      description: |
        The only sanctioned company get-or-create path. Resolves the seed through strong identifiers (profile URL, domain), runs the pre-create guards and the LLM research preflight, dedups against the Universe backbone and the fundable mirror, and creates the company with its initial graph node when nothing matches. Every branch returns the shell: guard misses come back 200 with `company_created: false` and null fields — a blocked input is an answer, not an error. A company name alone is never enough: the seed must carry a domain or profile URL. Requires scope `enrich:company`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAddCompanyRequest'
      responses:
        '200':
          description: The company shell (found, created, or typed miss).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyShellEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/persons/get-add:
    post:
      operationId: getAddPerson
      tags:
        - Enrichment
      summary: Get-or-create a person (the enrichment entry gate)
      description: |
        The only sanctioned person get-or-create path. Resolves the seed through its identifiers, dedups BEFORE paying for any provider, then runs the identity ladder (People Data Labs → Enrich Layer → Exa) only when nothing matched, and creates the person with an initial graph node. Every branch returns the shell: guard misses come back 200 with `person_created: false` and null fields — a blocked input is an answer, not an error. Requires scope `enrich:person`, which is independent of `enrich:company`. Two response fields need reading before you integrate. `match_via` names the key that resolved an existing person, so a caller can tell a LinkedIn hit from an email one. `fiber_deferred` means identity is still settling in a background run: the person row and node exist, enrichment has NOT been dispatched yet, and it fires automatically once the run lands — so poll the entity rather than re-posting the seed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAddPersonRequest'
      responses:
        '200':
          description: The person shell (found, created, or typed miss).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonShellEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/persona/persons/{id}:
    post:
      operationId: buildPersona
      tags:
        - Persona
      summary: Ask for a person's persona
      description: |
        Asks for the nine-dimension persona of one person: nine narratives, each embedded as its own vector, so people are matched dimension against the same dimension rather than as one averaged profile. Nothing is built by the time this returns. A synthesis runs for tens of seconds, so the work happens in a worker and this call only ever decides what to set in motion. Read `status` to know which: `exists` (200) means a persona built inside the freshness window already covers this person and nothing was started; `building` (202) means the evidence is present and a worker has the job; `queued` (202) means evidence is missing, whatever was absent has been started, and the person waits for it. A persona needs a deep bio and social insights, both of which take minutes to produce. When either is absent this call launches it and parks the person, and `started` names what it launched. Asking again while they wait is safe and cheap: it bumps a counter rather than queueing them twice, and starts nothing that is already running. Requires scope `persona:build`, which is independent of `enrich:person` — a client may be entitled to enrich a person without paying for their persona.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The canonical universe entity id of the person.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildPersonaRequest'
      responses:
        '200':
          description: A persona inside the freshness window already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaBuildEnvelope'
        '202':
          description: A build was started, or the person was queued for one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaBuildEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/leverage-loops:
    post:
      operationId: createLeverageLoop
      tags:
        - Persona
      summary: File a leverage loop
      description: |
        Files a leverage loop: who, out of the candidates the caller already knows, should the target be introduced to. The App owns who-knows-whom, so it pushes the whole candidate pool; the pipeline resolves them, builds the target's persona, scores both lanes, shortlists, drafts and judges the introductions. Minutes of work never run inline: the job is filed, a worker is nudged, and this call answers 202 with the job's bookkeeping. Poll `GET /v1/leverage-loops/{id}` with `job_id`, or set `callback_url` to be told. Idempotent on `suggestion_request_id`: a repeat returns the existing job, still 202, and does not nudge the worker again. `requested` is `false` only when the job was filed but the worker nudge failed. The body may be sent with `Content-Encoding: gzip` and is capped at 8 MiB either way; gzip at 20k candidates. When `callback_url` is set, the final `delivering` stage POSTs a `LeverageLoopWebhook` body to it; the row settles `delivered` only after the callback has answered, so a GET issued from inside the callback handler may still read `delivering` — take the suggestions from the webhook body and poll afterwards. The `X-Orbiter-Signature` header carries `sha256=<hex HMAC-SHA256 of the raw body>` keyed with the shared webhook secret, and is absent when the service has no secret configured — reject unsigned bodies in production. Up to four attempts, retried only on connection errors, 408, 429 and 5xx (not 501), with jittered exponential backoff (windows of 2s, 4s, 8s); any other answer of 300 or above fails on the first attempt. A failed delivery does not fail the job: `status` still settles `delivered`, the failure is recorded in `error`, and the GET remains the recovery path. Requires scope `leverage_loops:run`, which is independent of `persona:build` — a client may be entitled to personas without the loop, or the reverse.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeverageLoopRequest'
      responses:
        '202':
          description: The job, new or the existing one for this `suggestion_request_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeverageLoopEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The target person is unknown to the Universe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/leverage-loops/{id}:
    get:
      operationId: getLeverageLoop
      tags:
        - Persona
      summary: Poll a leverage loop
      description: |
        The polling read, and the recovery path when a webhook delivery failed. `id` is the `job_id` returned when the loop was filed, not the `suggestion_request_id`. `judge` and `suggestions` appear only once `status` is `delivered`; until then the response is the job's bookkeeping alone, and `error` carries the stage failure once it is `failed`. Requires scope `leverage_loops:run`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The loop's `job_id`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The job; suggestions and the judge verdict ride along once delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeverageLoopEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/companies/{id}/social-insights:
    post:
      operationId: companySocialInsights
      tags:
        - Enrichment
      summary: Generate on-demand social insights for a company
      description: |
        Runs the social-insights synthesis (Grok over six bounded web evidence results) for one company — an on-demand context tool for meeting prep and suggestion flows, deliberately NOT part of the enrichment pipeline. Requires scope `social_media_insights:company`. Results are cached for 5 days: a repeat call inside the window returns the stored insights with `cached: true` and costs no LLM run (pass `force: true` to rebuild anyway). Companies with no distilled about text return `skipped: true` — enrich first.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Bypass the 5-day cache and rebuild.
      responses:
        '200':
          description: The insights (fresh, cached, or a typed skip).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialInsightsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/persons/{id}/social-insights:
    post:
      operationId: personSocialInsights
      tags:
        - Enrichment
      summary: Generate on-demand social insights for a person
      description: |
        The person twin of the company trigger: a Grok synthesis over six bounded web evidence results, grounded in the person's distilled biography. On-demand context for meeting prep and suggestion flows, deliberately NOT part of the enrichment pipeline. Requires scope `social_media_insights:person` — a client sold company context is not thereby sold context on individuals. Results are cached for 5 days: a repeat call inside the window returns the stored insights with `cached: true` and costs no LLM run (pass `force: true` to rebuild anyway). People with no distilled biography return `skipped: true` — enrich first.
        Returns six outputs. `insights` name a platform and a time anchor; `interests` accumulate across runs rather than being replaced; `profile_urls` carry the evidence that bound them and are the only ones persisted, with everything refused recorded in `held_profile_urls`; `coverage_note` is the only place evidence- coverage commentary appears; `social_media_influence` is null rather than padded when the evidence cannot fill it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Bypass the 5-day cache and rebuild.
      responses:
        '200':
          description: The insights (fresh, cached, or a typed skip).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSocialInsightsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/enrichment/persons/{id}/deep-research:
    post:
      operationId: personDeepResearch
      tags:
        - Enrichment
      summary: Return a person's Deep Bio, or research one (plus social insights) without the full pipeline
      description: |
        For people enriched WITHOUT deep research: returns the stored Deep Bio when a successful run is younger than the freshness window (`DEEP_BIO_FRESHNESS_DAYS`, 90 by default), else launches one under every pipeline guard — confirmed name, something on file to research beyond the name, the daily spend cap, and single-flight (a live job is joined, never duplicated). Social insights chain automatically when the bio lands; a fresh hit that has no insights yet asks for them and reports `social_insights_requested: true`. Requires scope `deep_research:person` — the most expensive call this system makes, sold apart from `enrich:person`. `status` is `fresh` (200, `deep_bio` filled), `skipped` (200, see `skip_reason`, nothing spent), `created` or `already_running` (202). Poll by calling again: the same call returns `fresh` once the bio has landed and distilled. `force: true` re-researches inside the window; the daily cap still applies.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepResearchRequest'
      responses:
        '200':
          description: A fresh bio, or a typed skip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResearchEnvelope'
        '202':
          description: A job was created or is already running; poll by calling again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResearchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/callbacks/fullenrich:
    post:
      operationId: fullEnrichCallback
      tags:
        - Enrichment
      summary: Receive a finished FullEnrich profile (provider plane)
      description: |
        **Provider plane, not a consumer surface** — FullEnrich POSTs the profile we asked for. There is no API key and no scope: the caller proves itself with `X-Signature-SHA1`, an HMAC of the raw body keyed with the API key we call FullEnrich with. An unconfigured key denies every request. Documented for operators, not for integration: no consumer may call it, and it reads nothing out of the Universe. Delivery is at-least-once and may arrive more than once for one lookup, so the body is taken as evidence before it is judged. Every signed body is answered 200, including one we cannot parse or attribute — a non-2xx makes FullEnrich redeliver, and redelivery is what once wrote one person's profile onto another. A 500 means we failed to keep the payload and genuinely want it again.
      security:
        - providerSignature: []
      requestBody:
        required: true
        description: FullEnrich's webhook body, kept verbatim.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The delivery was taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
