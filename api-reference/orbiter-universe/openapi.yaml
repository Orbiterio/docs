          items:
            $ref: '#/components/schemas/ProjectionStageCredit'
        coverage:
          $ref: '#/components/schemas/ProjectionStageCoverage'
        derivative_works:
          type: array
          description: |
            The films and shows based on this production as Wikidata ties them (stage D52), drawn or not; additive to v1. `graph_status` says whether the `BASED_ON` edge (derivative → this production) is in the graph.
          items:
            $ref: '#/components/schemas/ProjectionStageDerivativeWork'
        based_on:
          type: array
          description: |
            The works this production is based on, per Wikidata P144 on its work item (a film today, D53); additive to v1. `graph_status` says whether the `BASED_ON` edge (this production → source) is in the graph.
          items:
