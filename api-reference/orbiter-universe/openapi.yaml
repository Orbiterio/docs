        The DONOR_TO ledger: one row per donor → recipient pair, its recomputed aggregate and revision, and whether the graph holds it. `pending` waits on a chosen `donor_to` fact or a node; `written` carries the edge uuid and the revision it was written at; `blocked` names why no weight can be assigned (`donor_class_unsupported` for a 990 filer's Schedule I, `no_eligible_gifts` after a withdrawal, `below_floor`, `bridge_gate_closed` for a trustee-derived row — real and revisioned, never projected until Q1/Q2 settle — and `mixed_routes_unsettled` for a pair holding both a direct gift and a derived route).
