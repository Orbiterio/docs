      summary: Draw one batch of pending stage award entries (management plane)
      description: |
        Stage award entries (stage awards slice, nodes.mdx `Stage_Award`): discovery files one `stage_awards` row per award row on a person's credit, keyed `award_entry_key` — body, year, category and scope with outcome excluded, so a nomination becoming a win keeps one node. This replay MERGEs the `Stage_Award` node on the entry key, draws `HAS_AWARD` from the production and `WON_AWARD`/`NOMINATED_FOR` from the person, and writes a deterministic description (the Game_Award contract's sentence, never a model call). A row whose person or production node is missing waits for a later pass. Rides the credit-edge tick too. A row whose person→production credit distill has not elected stays pending (stage D65). **Management plane, staff only** — a WorkOS session with role `admin`. Fails closed without `STAGE_EDGE_WRITES_ENABLED`.
