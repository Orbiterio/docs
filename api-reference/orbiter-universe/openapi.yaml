      required:
        - schema_version
        - suggestion_request_id
        - status
        - generated_at
        - suggestions
      properties:
        schema_version:
          type: integer
          description: Always 2.
        suggestion_request_id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            `complete` for a delivered loop, `partial` when the judge called the results thin, `failed` when the pipeline failed (with `suggestions: []`).
          enum:
            - complete
            - partial
            - failed
        generated_at:
          type: string
          format: date-time
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/LeverageLoopPackageSuggestion'
      additionalProperties: false
    LeverageLoop:
      type: object
      required:
        - job_id
        - suggestion_request_id
        - status
        - requested
        - target_entity_id
        - scored_count
        - dropped_count
      properties:
        job_id:
          type: string
          format: uuid
          description: The id to poll with.
        suggestion_request_id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            The stage the loop is at. Terminal states are `delivered` and `failed`.
          enum:
            - queued
            - resolving
            - persona
            - scoring
            - shortlisting
            - generating
            - verifying
            - judging
            - delivering
            - delivered
            - failed
        requested:
          type: boolean
          description: |
            Meaningful only on the first 202 for a `suggestion_request_id`: `false` means the row was filed but the worker nudge failed. A repeat POST and the GET always report `true`.
        target_entity_id:
          type: string
          format: uuid
          description: The canonical id of the target, merge chain resolved.
        scored_count:
          type: integer
        dropped_count:
          type: integer
        error:
          type: string
          description: |
            Present only when something failed: the stage error when `status` is `failed`, or the webhook failure (prefixed `webhook: `) when `status` is `delivered` but the callback could not be reached or answered 300 or above. Truncated to 700 characters.
        judge:
          $ref: '#/components/schemas/LeverageLoopJudge'
        suggestions:
          type: array
          description: Present only once `status` is `delivered`.
          items:
            $ref: '#/components/schemas/LeverageLoopSuggestion'
        package:
          $ref: '#/components/schemas/LeverageLoopPackage'
      additionalProperties: false
    LeverageLoopEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LeverageLoop'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
