          type: string
          format: date-time
        raw_key:
          type: string
      required:
        - id
        - client_id
        - label
        - expires_at
        - created_at
        - raw_key
    IssuedKeyEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/IssuedKey'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    SocialInsightsBackfill:
      type: object
      properties:
        found:
          type: integer
          description: Persons in this batch's backlog.
        requested:
          type: integer
          description: Forced insights requests published.
        failed:
          type: integer
          description: Requests that could not be published; the persons stay in the backlog.
        dry_run:
          type: boolean
        remaining:
          type: boolean
          description: |
            The batch filled to the limit, so more may be waiting. False is the only signal that the backlog is clear.
      required:
        - found
        - requested
        - failed
        - dry_run
        - remaining
    SocialInsightsBackfillEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SocialInsightsBackfill'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    SocialInsightsPersist:
      type: object
      properties:
        found:
          type: integer
        persisted:
          type: integer
        failed:
          type: integer
          description: Payloads that could not be decoded; they stay in the backlog.
        remaining:
          type: boolean
      required:
        - found
        - persisted
        - failed
        - remaining
    SocialInsightsPersistEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SocialInsightsPersist'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    DeepBioSweep:
      type: object
      required:
        - picked
        - requested
        - failed
        - job_ids
      properties:
        picked:
          type: integer
          description: Rows the sweep query returned.
        requested:
          type: integer
          description: Rows a worker was successfully asked to run.
        failed:
          type: integer
          description: |
            Rows whose run request could not be published. They stay picked for the next sweep.
        job_ids:
          type: array
          description: The jobs a run was requested for.
          items:
            type: string
            format: uuid
    DeepBioSweepEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/DeepBioSweep'
        error:
          type:
            - 'null'
        meta:
          type:
            - object
            - 'null'
    DeepBioForce:
      type: object
      required:
        - outcome
        - job_id
        - requested
      properties:
        outcome:
          type: string
          enum:
            - created
            - already_running
            - fresh
            - skipped
          description: |
            What the guards decided. `created` is a new job; `already_running` means single-flight handed back a live one; `skipped` means the daily cap refused. `fresh` cannot occur here — forcing bypasses the freshness window — and is listed only because the field shares its vocabulary with the launch outcome.
        job_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Null when the request was refused before a row existed.
        requested:
          type: boolean
          description: |
            Whether a worker was asked to run the job. False for a job that already has a worker, or when the run request failed.
    DeepBioForceEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/DeepBioForce'
        error:
          type:
            - 'null'
        meta:
          type:
            - object
            - 'null'
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, unknown, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The client lacks the entitlement scope for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
