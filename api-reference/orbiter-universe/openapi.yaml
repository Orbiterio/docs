  /v1/admin/enrichment/music/seed:
    post:
      operationId: seedMusicEntity
      tags:
        - Enrichment
      summary: Seed one MusicBrainz entity (management plane)
      description: |
        Drives the music entry gate for one MusicBrainz reference. This is the pipeline's only deterministic trigger and it replaces Xano's six separate seed endpoints with a single `kind` field. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants it: the call creates entities and spends provider credit. **There is deliberately no consumer route.** The publish contract serves packages for companies and persons only, so a client able to trigger a music run could not read the result back — a door into a room with no lights. The route and the music projection are one contract addition and ship together. `mbid` accepts a bare MusicBrainz id or a full musicbrainz.org URL; a query string or fragment is stripped, so a pasted address-bar URL works. A reference that is not MusicBrainz, or that names a different kind than `kind` claims, is refused before anything is created. `kind: artist` splits on MusicBrainz's own artist type: a Person or Character becomes a **person** and its music fields land in a satellite, while a Group, Orchestra or Choir becomes a **music_group**. Pass `artist_type` when you already know it to save a lookup; omitted, the gate spends one paced request to find out, and refuses rather than guessing if it cannot. `kind: label` becomes a **company** — a record label is a company, and it enters through the company gate like any other. Omitting `queue` parks the row for the drain, which is the normal choice. `queue: false` runs the orchestrator inline and is for smoke testing one entity at a time. Every outcome is a 200 with an `action`: a refusal is an action, not an error. Read `action` first — `queued`, `enriched_direct`, `delegated`, `dedup_fresh`, `cap_blocked`, `skipped_gone`, `skipped_not_musicbrainz`, `skipped_unknown_artist_type`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedMusicRequest'
      responses:
        '200':
          description: |
            What the gate did. A refusal is a 200 carrying its `action`, because the gate reached a decision — only a broken dependency is a 5xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedMusicEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
