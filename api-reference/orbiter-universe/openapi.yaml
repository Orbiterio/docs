          enum:
            - queued
            - refresh_queued
            - enriched_direct
            - refresh_enriched
            - delegated
            - dedup_fresh
            - cap_blocked
            - cap_existing
            - skipped_gone
            - skipped_no_ref
            - skipped_not_musicbrainz
            - skipped_unknown_artist_type
        entity_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            The CANONICAL id — a merged loser resolves to its winner first. Null on a refusal that resolved nothing.
        entity_type:
          type: string
          description: |
            What the reference resolved TO, which `kind` alone does not say: an artist becomes `person` or `music_group`, and a label becomes `company`.
        mbid:
          type: string
          description: The canonical bare lowercased id.
        name:
          type: string
        node_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: Null until the graph node write lands.
        created:
          type: boolean
          description: True only on a fresh entity.
        enriched:
          type: boolean
          description: True once a run has completed for this entity.
      required:
        - action
        - entity_type
        - mbid
        - name
        - created
        - enriched
