        data:
          $ref: '#/components/schemas/StageMention'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    StageAdmitRequest:
      type: object
      properties:
        source:
          type: string
          description: The raw source name of the production reference.
          enum:
            - broadwayworld
            - wikidata
            - wikipedia
            - tony
            - olivier
            - pilot_submission
            - programme
            - official
            - ibdb
            - playbill
            - theatricalia
            - solt
        object_kind:
          type: string
          description: Only a production can be admitted; a party or work is refused.
          enum:
            - production
        source_id:
          type: string
          maxLength: 512
          description: |
            The source's own id for the engagement, exact and case-sensitive — an IBDB production number, a Theatricalia production slug, or the reviewed registry key for a submission. Never a URL to parse.
        source_url:
          type:
            - string
            - 'null'
          format: uri
        display_name:
          type:
            - string
            - 'null'
          maxLength: 512
          description: The billed title, when known; omitted, the hub carries a provisional label.
        market:
          type: string
          enum:
            - broadway
            - west_end
        scheduling_class:
          type: string
          description: |
            Intake class, not a queue tier. `p0`/`p1` queue at drain tiers 0/1; `p2` is parked in the historical inventory. Defaults to `p1`.
          enum:
            - p0
            - p1
            - p2
            - P0
            - P1
            - P2
        refresh_mode:
          type: string
          description: '`if_due` (default) leaves a fresh production alone; `force` queues it regardless.'
          enum:
            - if_due
            - force
        dry_run:
          type: boolean
          description: Predict the action with no write, provider call, entity creation or queue mutation.
      required:
        - source
        - object_kind
        - source_id
        - market
    StageAdmit:
      type: object
      properties:
        action:
          type: string
          enum:
            - queued
            - parked
            - already_pending
            - fresh_existing
            - awaiting_dependency
            - refused
        reason:
          type: string
          description: |
            Why a non-queued action: `intake_disabled`, `market_disabled`, `source_disabled`, `source_has_no_production_key`, `root_budget_exhausted`, `cap_blocked`, `depth_exceeded`, `historical_inventory`, `fresh`, `pending`.
        job_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The durable admission row; null on a dry run or a disabled lane.
        production_entity_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The canonical `stage_production`; null when none could be identified.
        source_record_id:
          type:
            - string
            - 'null'
          format: uuid
        created_entity:
          type: boolean
          description: A new canonical production was minted (predicted on a dry run).
        dry_run:
          type: boolean
      required:
        - action
        - job_id
        - production_entity_id
        - source_record_id
        - created_entity
        - dry_run
    StageAdmitEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StageAdmit'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    StageProductionStatus:
      type: object
      properties:
        entity_id:
          type: string
          format: uuid
        lifecycle_state:
          type: string
          enum:
            - discovered
            - admitted
            - extracted
            - resolved
            - projected
            - retired
        credit_finality:
          type: string
          enum:
            - unknown
            - provisional
            - final
        active_input_revision:
          type:
            - string
            - 'null'
        active_extraction_revision:
          type:
            - string
            - 'null'
        next_refresh_at:
          type:
            - string
            - 'null'
          format: date-time
        last_complete_snapshot_at:
          type:
            - string
            - 'null'
          format: date-time
        primary_source_record_id:
          type:
            - string
            - 'null'
          format: uuid
        source_records:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              source:
                type: string
              object_kind:
                type: string
              source_id:
                type: string
              mapping_status:
                type: string
                enum:
                  - unresolved
                  - auto_linked
                  - needs_review
                  - review_linked
                  - rejected
                  - disputed
            required:
              - id
              - source
              - object_kind
              - source_id
              - mapping_status
        snapshots:
          type: integer
          format: int64
        mentions_by_state:
          type: object
          additionalProperties:
            type: integer
            format: int64
        credits_by_status:
          type: object
          additionalProperties:
            type: integer
            format: int64
        checkpoints:
          type: array
          items:
            type: object
            properties:
              phase:
                type: string
              state:
                type: string
              count:
                type: integer
                format: int64
            required:
              - phase
              - state
              - count
        queue:
          type:
            - object
            - 'null'
          description: The shared queue row, when the production is pending.
          properties:
            priority_tier:
              type: integer
            attempts:
              type: integer
            locked_since:
              type:
                - string
                - 'null'
              format: date-time
          required:
            - priority_tier
            - attempts
            - locked_since
      required:
        - entity_id
        - lifecycle_state
        - credit_finality
        - source_records
        - snapshots
        - mentions_by_state
        - credits_by_status
        - checkpoints
        - queue
    StageProductionStatusEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StageProductionStatus'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    StagePublishEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            claimed:
              type: integer
            completed:
              type: integer
            waiting:
              type: integer
            failed:
              type: integer
          required:
            - claimed
            - completed
            - waiting
            - failed
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    StageResolveEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            claimed:
              type: integer
            completed:
              type: integer
            continued:
              type: integer
            failed:
              type: integer
            mentions:
              type: integer
            accepted:
              type: integer
            needs_review:
              type: integer
            unresolved:
              type: integer
            deferred:
              type: integer
          required:
            - claimed
            - completed
            - continued
            - failed
            - mentions
            - accepted
            - needs_review
            - unresolved
            - deferred
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    StageSubmissionRequest:
      type: object
      description: The versioned pilot submission contract.
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        submission_id:
          type: string
          maxLength: 128
        record_id:
          type: string
          maxLength: 128
        revision:
          type: integer
          minimum: 1
          description: A correction is a new revision; the same revision must carry the same bytes.
        received_at:
          type: string
          format: date-time
        submitter:
          type: string
          maxLength: 256
        reference:
          type: string
          maxLength: 512
        basis:
          type: string
          maxLength: 512
          description: The recorded basis for pilot use of this list.
        production:
          type: object
          properties:
            registry_id:
              type: string
              maxLength: 128
              description: The reviewed production registry key, one token; the production's strong identity.
            title:
              type: string
              maxLength: 512
            market:
              type: string
              enum:
                - broadway
                - west_end
            venue:
              type: string
              maxLength: 256
            first_preview_date:
              type: string
              format: date
            opening_date:
              type: string
              format: date
            closing_date:
              type: string
              format: date
          required:
            - registry_id
            - title
            - market
        credit_blocks:
          type: array
          description: Producing sections as printed. May be empty; partial evidence never retracts.
          items:
            type: object
            properties:
              heading:
                type: string
                maxLength: 256
              groups:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    role_raw:
                      type: string
                      maxLength: 256
                      description: The group's own stated role; omitted, the block heading is the role.
                    billed_text:
                      type: string
                      maxLength: 1024
                    source_party_ref:
                      type: string
                      maxLength: 256
                    evidence_locator:
                      type: string
                      maxLength: 512
                    credit_start:
                      type: string
                      format: date
                    credit_end:
                      type: string
                      format: date
                  required:
                    - billed_text
            required:
              - heading
              - groups
        completeness:
          type: string
          enum:
            - unknown
            - partial
            - provisional
            - complete
            - empty_confirmed
          description: A source's unfinished-credit notice prevents `complete`.
        notices:
          type: array
          items:
            type: string
            maxLength: 1024
        review:
          type: object
          properties:
            reviewer:
              type: string
              maxLength: 256
            reviewed_at:
              type: string
              format: date-time
            decision:
              type: string
              enum:
                - approved
                - rejected
          required:
            - reviewer
            - reviewed_at
            - decision
      required:
        - schema_version
        - submission_id
        - record_id
        - revision
        - received_at
        - submitter
        - basis
        - production
        - completeness
        - review
    StageSubmission:
      type: object
      properties:
        admission:
          $ref: '#/components/schemas/StageAdmit'
        input_revision:
          type: string
          description: '`<submission_id>@<revision>`, the requested input revision the queue and checkpoints key on.'
        payload_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The stored verbatim revision; null when the production was not admitted.
        stored:
          type: boolean
          description: True when this call stored the revision; false for a repeat of the same bytes.
      required:
        - admission
        - input_revision
        - payload_id
        - stored
    StageSubmissionEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StageSubmission'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    InvestorNarrative:
      type: object
      required:
        - schema_version
        - id
        - requested_id
        - entity_type
        - narrative
      properties:
        schema_version:
          type: string
          description: Wire contract version. A breaking change gets a new version, not an edit.
          example: investor_narrative.v1
        id:
          type: string
          format: uuid
          description: The canonical entity id, after the merge chain is resolved.
        requested_id:
          type: string
          format: uuid
          description: |
            The id as asked for. Differs from `id` when the requested entity was merged away; a consumer should heal its stored reference.
        entity_type:
          type: string
          description: The canonical entity's type.
          example: company
        narrative:
          $ref: '#/components/schemas/ProjectionEvidenceNarrative'
          description: |
            The same shape the company projection carries in its `evidence_narrative` section, so a consumer parses one type.
    InvestorNarrativeEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/InvestorNarrative'
        error:
          type: 'null'
    DeepBioSweep:
      type: object
      required:
        - picked
        - requested
        - failed
        - job_ids
      properties:
        picked:
          type: integer
          description: Rows the sweep query returned.
        requested:
          type: integer
          description: Rows a worker was successfully asked to run.
        failed:
          type: integer
          description: |
            Rows whose run request could not be published. They stay picked for the next sweep.
        job_ids:
          type: array
          description: The jobs a run was requested for.
          items:
            type: string
            format: uuid
    DeepBioSweepEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/DeepBioSweep'
        error:
          type:
            - 'null'
        meta:
          type:
            - object
            - 'null'
    DeepBioForce:
      type: object
      required:
        - outcome
        - job_id
        - requested
      properties:
        outcome:
          type: string
          enum:
            - created
            - already_running
            - fresh
            - skipped
          description: |
            What the guards decided. `created` is a new job; `already_running` means single-flight handed back a live one; `skipped` means the daily cap refused. `fresh` cannot occur here — forcing bypasses the freshness window — and is listed only because the field shares its vocabulary with the launch outcome.
        job_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Null when the request was refused before a row existed.
        requested:
          type: boolean
          description: |
            Whether a worker was asked to run the job. False for a job that already has a worker, or when the run request failed.
    DeepBioForceEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/DeepBioForce'
        error:
          type:
            - 'null'
        meta:
          type:
            - object
            - 'null'
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, unknown, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The client lacks the entitlement scope for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
