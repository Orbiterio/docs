    SeedMusicRequest:
      type: object
      properties:
        kind:
          type: string
          description: |
            Which MusicBrainz entity `mbid` addresses. Note `release_group` uses an underscore here while MusicBrainz's own path segment is `release-group`.
          enum:
            - artist
            - label
            - release_group
            - recording
            - work
            - event
        mbid:
          type: string
          description: A bare MusicBrainz id, or a musicbrainz.org URL.
        name:
          type: string
          description: |
            A label for the row until the run repairs it from the payload. Omitted, the mbid is used — a poor label but far better than none.
        artist_type:
          type: string
          description: |
            MusicBrainz's own artist type, when you already know it. Saves the gate one paced lookup on an `artist` seed and is ignored otherwise.
          enum:
            - Person
            - Character
            - Group
            - Orchestra
            - Choir
        queue:
          type:
            - boolean
            - 'null'
          description: |
            Omit to park the row for the drain (normal). `false` runs the orchestrator inline, for driving one entity at a time.
        priority_tier:
          type:
            - integer
            - 'null'
          description: Passed through as given; an explicit 0 survives as 0.
