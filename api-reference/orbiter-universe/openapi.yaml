  /v1/admin/enrichment/stage/drain:
    post:
      operationId: drainStage
      tags:
        - Enrichment
      summary: Drive one stage queue row or a bounded stage batch (management plane)
      description: |
        With `queue_id`, runs that one row now through the shared manual drive (tier and lane flags ignored, the cap and the depth ceiling not). Without it, drains a bounded batch of the `stage_production` partition; `max_rows` is capped by the validator and again by the configured tick size, so there is no uncapped sweep. A missing stage runner leaves rows queued and reports zero picks. **Management plane, staff only.** Stage rows have two outcomes the other lanes do not: `poisoned` (the row's canonical entity is not a stage production — deleted, never run through another lane) and `deferred` (the run made no progress by design, such as an exhausted budget — the row is released without spending an attempt).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageDrainRequest'
      responses:
        '200':
          description: What the drive did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageDrainEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/facts:
    post:
      operationId: publishStageFacts
      tags:
        - Enrichment
      summary: Run one bounded facts publication now (management plane)
      description: |
        Drains due `facts` obligations: for each production it lands one `stage_credit` envelope per accepted mention of the active extraction on that mention's PRODUCER, and one `stage_production_profile` envelope on the production, in the shared payload ledger — the facts feature then normalizes, elects and distills them like any provider's. An unclassified producing role earns no credit envelope. Completes each obligation and raises the `graph` obligation. Envelopes are keyed by mention and input revision, so a repeated pass lands the same bytes under the same keys. Nothing here writes `entity_facts` or the graph. **Management plane, staff only.** Like the resolve pass, the tick gate is not consulted; without `STAGE_ENABLED` the sink is unwired and the pass reports zero claims.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_productions:
                  type: integer
                  minimum: 1
                  maximum: 50
      responses:
        '200':
          description: What the publication did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageFactsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/graph:
    post:
      operationId: publishStageGraph
      tags:
        - Enrichment
      summary: Run one bounded graph publication now (management plane)
      description: |
        Two passes. The reconcile drains due `graph` obligations into desired `stage_credit` rows: one per producer/production pair the active extraction accepted on an earning tier, `ready` when the producer's distill elected the production and `awaiting_fact` until it has, and every pair the ledger holds that the roster no longer names flipped `retract_pending`. It completes each obligation and raises `publish`. The replay then leases due rows and projects each onto ONE `PRODUCED` edge (MERGE on the endpoint pair; tier, weight, `active` and `stage_credit_version` as properties, never a delete), acknowledging exactly the version it wrote; a row whose fact is unelected or whose endpoint has no node yet is released pending and heals on a later tick. **Management plane, staff only.** The replay fails closed without `STAGE_EDGE_WRITES_ENABLED` on every path, this one included: rows are desired but no edge is written.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_productions:
                  type: integer
                  minimum: 1
                  maximum: 50
      responses:
        '200':
          description: What the publication did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageGraphEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/mentions:
    get:
      operationId: listStageMentions
      tags:
        - Enrichment
      summary: List one production's credit mentions (management plane)
      description: |
        The stage review queue (ORBIT-1863, slice 4). Every mention Stage A extracted for one production, with its group's billing context and its current resolution state, keyset paginated on id. Filter with `state` to see what the ladder left for a human: `needs_review` (one name-only candidate capped at 0.59, or several candidates), `unresolved` (no candidate at all), `disputed`. Read-only. **Management plane, staff only.**
      security:
        - bearerAuth: []
      parameters:
        - name: production_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - unresolved
              - auto_linked
              - needs_review
              - review_linked
              - rejected
              - disputed
        - name: after
          in: query
          required: false
          description: The last id of the previous page.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: One page; `next` is the id to pass as `after`.
