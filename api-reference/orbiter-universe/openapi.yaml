  /v1/backfill/graph/reconcile:
    post:
      operationId: reconcileGraph
      tags:
        - Graph
      summary: Re-run graph syncs for entities whose ledger says the graph is behind
      description: |
        Operator-only, non-destructive. Drains one bounded batch per selected `target` queue by re-running the same idempotent syncs the pipeline events trigger — the recovery path for sync events lost for good (worker booted without a graph client, redelivery past retention, dead-lettered messages). `companies`: entities with a master_companies row and graph_written_at null or older than last_enriched_at get a full node property sync. `locations`: companies with pending master_addresses rows and an existing company node get the address drain; node-less companies are reported as `awaiting_node` (sync companies first). `funding_rounds`: funding_rounds rows with a null graph link (never written, or node-wiped) get their round node + RAISED edge re-merged from row state under the row's own id — the original deal-id MERGE key died with the wiped node — with deals left stamped processed, so this replaces the wipe's table-side-reset caveat without duplicate rows; INVESTED_IN edges are NOT rebuilt (those need a deal reprocess). `all` (default) runs every queue. Successful rows stamp their ledger and leave the queue; re-run while `has_more` is true. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum:
                    - companies
                    - locations
                    - funding_rounds
                    - all
                  description: Queue to drain; omitted = all.
                limit:
                  type: integer
                  description: Entities per queue batch (default 15, max 500).
      responses:
        '200':
          description: Per-queue batch summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/drift:
    post:
      operationId: graphDrift
      tags:
        - Graph
      summary: Audit the graph against every SQL write-back ledger; optionally sweep orphans
      description: |
        Operator-only. Inventories every node and edge in the graph and diffs it against the union of every `*_node_uuid` / `*_edge_uuid` ledger column in Postgres. A graph object no ledger claims is an orphan; a ledgered uuid the graph lacks is lost. With `sweep` false (default) the call only reports. With `sweep: true` it DETACH-DELETEs the orphans — destructive, so `confirm: true` is then required, the same guard as the wipe. Seeded reference nodes are never deleted. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sweep:
                  type: boolean
                  description: Delete the orphans the audit finds; false = report only.
                confirm:
                  type: boolean
                  description: Required (true) when sweep is true — guards against stray POSTs.
              if:
                properties:
                  sweep:
                    const: true
                required:
                  - sweep
              then:
                properties:
                  confirm:
                    const: true
                required:
                  - confirm
      responses:
        '200':
          description: The audit report; counts everywhere, bounded samples for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
