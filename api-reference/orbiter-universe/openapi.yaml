      description: |
        Reads a production's control row, its typed source records, and independent counts of snapshots, mentions by resolution state, credits by reconciliation status and obligations by phase and state, plus its queue row when one exists. Independent on purpose: partial resolution is neither failure nor done, and no single flag says otherwise. **Management plane, staff only.** Strictly read-only: it never claims, releases or reconciles anything. A merged id resolves to its survivor.
      security:
