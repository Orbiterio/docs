  /v1/admin/enrichment/stage/discovery:
    post:
      operationId: discoverStageRoots
      tags:
        - Enrichment
      summary: Run one bounded discovery pass over parked person roots (management plane)
      description: |
        Drains the person-seeded discovery roots the theatre trigger parks (stage D32/D34): for each root blocked `awaiting_adapter` it finds the person's Playbill page from a held `playbill_party` key, a filed link or one search that mints the key (else recodes the root `awaiting_identity`), re-queues the root, reads the page's roles and admits every production on it through the stage gate at depth 1, class p1, under the root's ceiling. The person's own role is context, never a credit. **Management plane, staff only.** Needs the Playbill adapter (`STAGE_SOURCES` includes `playbill`, a Firecrawl key) and `STAGE_DISCOVERY_ENABLED` for the tick; this route runs regardless.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_productions:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Roots per pass, capped by the tick size.
      responses:
        '200':
          description: What the pass did.
          content:
            application/json:
