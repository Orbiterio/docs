        `stage_production_projection.v1` — a Broadway / West End production and its producing credits, served from the credit and evidence ledgers. Every credit the ledger holds is listed, withdrawn ones with `active: false` so a consumer can retire what it stored; a credit's `graph_status` says whether its `PRODUCED` edge is drawn. The `coverage` block is the honesty contract: `credit_coverage` and `credit_finality` name what the roster is, and `graph_ready` is false while any active credit is short of the graph. Breaking changes require a new schema_version, never an edit.
      properties:
        schema_version:
