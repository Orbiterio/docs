  /v1/admin/enrichment/stage/publish:
    post:
      operationId: publishStagePackages
      tags:
        - Enrichment
      summary: Settle due stage publish obligations now (management plane)
      description: |
        Claims due `publish` obligations (raised by the graph reconcile) and completes each whose package is consumable: the profile is distilled and every active credit's edge is written at its desired version. An obligation short of that is held `retry_wait` with the reason (`profile_pending`, `graph_pending`) and the pending-credit count. The package itself is served on demand by `GET /v1/entities/{id}/projection`; nothing is materialised here. **Management plane, staff only.** Fails closed without `STAGE_PUBLISH_ENABLED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_productions:
                  type: integer
                  minimum: 1
                  maximum: 50
      responses:
        '200':
          description: What the pass did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagePublishEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/resolve:
    post:
      operationId: resolveStage
      tags:
        - Enrichment
      summary: Run one bounded resolve pass now (management plane)
      description: |
        Drives Stage B over due `resolve` obligations: claims up to `max_productions` (capped by the tick size), runs the deterministic ladder once per open mention — an approved party alias or a reviewer-supplied strong key is a deterministic reuse; a name alone nominates candidates and is filed `needs_review`, capped at the name-only confidence; search and adjudication are recorded as deferred while their gates are closed — writes the decision history, completes or continues each obligation under the per-tick group budget, and raises the facts obligation for accepted identities. Nothing here creates an entity or writes an edge. **Management plane, staff only.** Like the manual drain, the lane's resolution flag is not consulted; the pass still needs the ladder constructed, which `STAGE_ENABLED` and `STAGE_RESOLUTION_ENABLED` together provide — without them the pass reports zero claims.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_productions:
                  type: integer
                  minimum: 1
                  maximum: 50
      responses:
        '200':
          description: What the pass did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResolveEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/submissions:
    post:
      operationId: submitStageProduction
      tags:
        - Enrichment
      summary: Store one reviewed pilot credit list and admit its production (management plane)
      description: |
        The private-pilot intake (ORBIT-1863, slice 3). A participant-supplied, reviewed credit list for one engagement enters the same source record, snapshot, group, mention and checkpoint path a web adapter would, with an explicit import acquisition and no fabricated fetch metadata. **Management plane, staff only.** The body is the versioned submission contract (`schema_version: 1`). The production is admitted through the stage gate under the submission's `registry_id` (a `stage_registry` strong key), with `refresh_mode: force` so a new revision re-runs a production the gate would otherwise call fresh; then the revision is stored verbatim in the payload ledger under `pilot_submission`. The same `submission_id` + `revision` with the same bytes is idempotent (200, `stored: false`); the same revision with different bytes is a 409 — a correction is a new revision, and a partial submission never deletes earlier accepted support. A submission whose review decision is `rejected` is refused at the door and stores nothing. Extraction happens when the queued production drains: the stage orchestrator loads the newest stored revision, records an `imported` snapshot keyed by that revision, runs the deterministic Stage A parser (tiers from the stated role, members split only on commas, slashes and a lone first name before "and"; an ampersand never splits) and commits groups, mentions, the production's revision advance and the resolve obligation in one transaction. Nothing resolves an identity or writes an edge in this slice.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSubmissionRequest'
      responses:
        '200':
          description: The revision was already stored, or the production was not admitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageSubmissionEnvelope'
        '202':
          description: The revision is stored and the production admitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageSubmissionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            This submission revision is already stored with different content, or the registry key already maps to something that is not a stage production.
        '500':
          $ref: '#/components/responses/Internal'
  /v1/entities/{id}/investor-narrative:
    get:
      operationId: getInvestorNarrative
      tags:
        - Projections
      summary: Get an investor's evidence narrative on its own
      description: |
        Returns the same evidence-stage narrative the company projection carries in its `evidence_narrative` section, for a consumer that holds an entity id and wants the narrative without pulling the whole distilled package.
        Text and aggregates only. Embeddings and thesis fingerprints are never returned by this route — they are internal to the thesis feature and absent from the shape, not filtered out of it.
        The id resolves through the merge chain first, and the response carries both the canonical `id` and the `requested_id` so a consumer holding a merged id can heal its stored reference.
        404 when the entity has no narrative, which is the case for most entities: a narrative is generated only for investors with enough classified evidence. A fault reading the narrative is a 500, never a 404 — a consumer must be able to tell "has none" from "could not look".
        Requires scope `investor_narrative:read`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Entity id. Resolved through the merge chain first.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The investor's evidence narrative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorNarrativeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/agents/deep-bio/sweep:
    post:
      operationId: sweepDeepBioJobs
      tags:
        - Agents
      summary: Re-drive Deep Bio jobs that stopped without settling (management plane)
      description: |
        Picks the research jobs that stalled and asks a worker to run each again. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants this, because a swept job can spend provider credit. Three kinds of row are picked: a `pending` job whose run request was lost, an `error` job whose retry is due, and a `running` job whose lease expired because its worker died. Jobs out of attempts are never picked, so a doomed job stops being swept rather than looping. The case this exists for is a job RELEASED after its envelope landed: it holds a paid, valid payload that nothing else will ever normalize. Sweeping that job usually costs NOTHING, because the runner resumes from the stored envelope instead of re-buying the research. It only REQUESTS runs — it never creates a job, so it cannot spend outside the launch guards (freshness window and daily cap). One bounded batch per call, so an operator watches the counts rather than starting an unbounded drain. A full batch is not a cleared backlog: call again until `picked` is zero.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Jobs to request in this batch. Omitted uses the server default (5, matching the cron's batch size).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: |
            What the sweep asked for. `picked` is what the query returned and `requested` is what was published; a gap means the topic refused and those rows stay picked for the next sweep.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepBioSweepEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/agents/deep-bio/persons/{id}/force:
    post:
      operationId: forceDeepBio
      tags:
        - Agents
      summary: Research one person's Deep Bio again (management plane)
      description: |
        Creates a research job even when the person already has a recent successful one, bypassing the freshness window. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants this: one call buys minutes of web research and tens of thousands of output tokens. The daily spend cap STILL APPLIES. Forcing is for re-running one person, never for getting past the ceiling — a refusal by the cap returns 200 with `outcome: skipped` and a null `job_id`, because nothing went wrong, the answer is no. Single-flight still applies too: a person with a live job gets that job's id back rather than a second one. `requested` is false when the job exists but no worker was asked (the run request failed) — the sweep above collects it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The person entity's canonical id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The job the request resolved to, and what the guards decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepBioForceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Consumer API key issued by the consumers registry.
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature-SHA1
      description: |
        Provider callback plane. Hex-lowercase HMAC-SHA1 of the raw request body, keyed with the API key we call that provider with — so the provider holds no consumer identity and no second secret exists. Verified against the bytes as sent; a re-serialized body has a different digest.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    Error:
      type: object
      properties:
        code:
          type: string
          description: Upper-snake error kind (VALIDATION_FAILED, NOT_FOUND, ...).
        message:
          type: string
        details:
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
      required:
        - code
        - message
    ErrorEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    EmptyEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The canonical (living) entity id. Persist this one.
        requested_id:
          type: string
          format: uuid
          description: The id the caller asked for; differs after a merge.
        entity_type:
          type: string
        display_name:
          type:
            - string
            - 'null'
      required:
        - id
        - requested_id
        - entity_type
        - display_name
    EntityEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Entity'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    ProjectionCompany:
      type: object
      description: The company record. Maps to the consumer's companies table.
      properties:
        name:
          type:
            - string
            - 'null'
        aliases:
          type: array
          items:
            type: string
          description: |
            Every known alias. A consumer storing a single alias takes the first — Universe does not drop the rest at the boundary.
        legal_name:
          type:
            - string
            - 'null'
        logo:
          type:
            - string
            - 'null'
        logo_storage_key:
          type:
            - string
            - 'null'
