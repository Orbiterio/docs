    PurgeCollateral:
      type: object
      description: |
        **What the purge costs entities that are NOT being purged.** A purge is never limited to its target: the target is referenced by other entities' rows, and those references have to resolve to something once it is gone. Two database mechanisms do that automatically, and this object is the receipt for both.

        **Worked example.** Purging the company *Resend* also touches every person who worked there. Their `person_work_experience` rows are NOT deleted — `company_entity_id` is ON DELETE SET NULL, so each row survives with its `company_name` string ("Resend") intact but its resolved id nulled. Meanwhile each of those people had a `works_at → Resend` relation fact in `entity_facts`, and `value_entity_id` is ON DELETE CASCADE, so those facts are deleted outright. So one company purge might report `relation_facts_deleted: 12`, `references_nulled: 15`, with `by_table.person_work_experience: 12` and `by_table.master_persons: 3`.

        **All zeros means the purge was self-contained** — nothing outside the target referenced it, which is the normal result for a person nobody else points at. It is not an error and not a missing feature.

        Counted BEFORE the delete runs, and returned identically for `dry_run: true` — which is the point: run the dry run first and read this object to see who else gets edited.
      properties:
        relation_facts_deleted:
          type: integer
          description: |
            entity_facts rows on SURVIVING entities whose value_entity_id pointed at the purged set. These are DELETED (ON DELETE CASCADE) — a relation fact pointing at nothing is not a fact. Re-enriching the surviving entity rebuilds them.
        shared_awards_deleted:
          type: integer
          description: |
            film_tv_awards rows anchored on the purged set that also carry a SURVIVING anchor — deleted rather than nulled because an award with both anchors null violates the at-least-one CHECK. The surviving side loses the award record too.
        references_nulled:
          type: integer
          description: |
            Total rows on surviving entities whose resolved FK to the purged set was SET NULL. The rows SURVIVE and keep the raw provider string beside the FK, so nothing is lost outright — but they now read as unresolved and will re-resolve on their next enrichment run. Equals the sum of by_table.
        by_table:
          $ref: '#/components/schemas/PurgeCollateralByTable'
      required:
        - relation_facts_deleted
        - shared_awards_deleted
        - references_nulled
        - by_table
