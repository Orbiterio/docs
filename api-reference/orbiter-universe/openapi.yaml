                $ref: '#/components/schemas/StageMentionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The mention is no longer at `expected_identity_revision`.
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/music:
    post:
      operationId: drainStageMusic
      tags:
        - Enrichment
      summary: Settle one batch of cast-recording observations from Music runs (management plane)
      description: |
        The music → stage trigger (stage D55). Every Music run that reads a release-group page (an artist's catalogue, a label's releases, a release-group's own lookup) runs a deterministic cast-recording detector over the text it already holds — cast wording in the title or disambiguation, exclusions (off-Broadway, tour, concert, film, demo) decided before any positive match — and files one observation per candidate beneath one accounting root per Music seed; a run files at most five eligible candidates and a seed holds at most ten. This drain settles eligible observations: a production already held with the same title, market and cast year completes it; otherwise, behind `STAGE_LLM_ENABLED`, a grounded model call locates the engagement's Playbill or Theatricalia page, the page is fetched and checked against the evidence (show, market, cast year), and only then is it admitted through the stage gate with the Music lineage and depth. No page, or a page that disagrees: held for a week. MusicBrainz is provenance only; the production's key is the registry's. Answers the `enrichment.stage_music_requested` event too. **Management plane, staff only.** Needs `STAGE_MUSIC_DISCOVERY_ENABLED`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: What the drain did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      observations:
                        type: integer
                      matched:
                        type: integer
                      located:
                        type: integer
                      admitted:
                        type: integer
                      held:
                        type: integer
                      failed:
                        type: integer
                    required:
                      - observations
                      - matched
                      - located
                      - admitted
                      - held
                      - failed
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
