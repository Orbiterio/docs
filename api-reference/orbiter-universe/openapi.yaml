          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/stage/posters:
    post:
      operationId: rehostStagePosters
      tags:
        - Enrichment
      summary: Re-host one batch of stage covers into our bucket now (management plane)
      description: |
        The stage cover re-host drain (stage D43): the same drain the media tick runs for avatars and title posters. Each un-rehosted profile with a `poster_source_url` is fetched, converted aspect-preserving to WebP and stored under `<media prefix>/playbill/<production id>`; the profile's `poster_url` and `poster_storage_key` are stamped and the node re-synced. A dead source is retired after `MEDIA_REHOST_MAX_ATTEMPTS`; `poster_url` stays null so the package serves the source cover. **Management plane, staff only.** Fails closed without a bucket.
      security:
