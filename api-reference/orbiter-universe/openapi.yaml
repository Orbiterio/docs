      summary: Read one person's enrichment receipts (management plane)
      description: |
        Answers "why is this person not done" from the stage ledger. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key: attempt counts, error codes and lease deadlines are operations data. There is no scope that grants this. Strictly read-only: it never claims, releases or heartbeats a receipt, so diagnosing a stalled run cannot alter it. Per run it reports the seven completion counts (each with its denominator), the terminal predicate with its pending and failed clauses, the visibility verdict alongside `has_strong_identity` so a false verdict says which half of the gate failed, and the company dependency. Per stage it reports status, attempts, the failure code, `will_retry` (whether the sweeper is coming back), `parked`, `duration_ms`, and — for a running stage — `running_for_seconds` beside `heartbeat_age_seconds`, whose combination is the only way to see a step that is wedged but still alive. The identity (Exa Fiber) lane appears as its own run: it carries a separate run id by design, so it is never scored by the predicate.
