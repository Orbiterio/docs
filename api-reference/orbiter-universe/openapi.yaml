  /v1/admin/entities/reviews/{id}/merge:
    post:
      operationId: mergeReviewItem
      tags:
        - Admin
      summary: Merge the pair a review filing names (management plane)
      description: |
        A human's half of the merge project: confirms a pending filing and runs the same merge transaction a strong-key clash runs — repoint every reference through the merge inventory, tombstone the loser with `merged_into`, ledger the manifest for undo, delete the loser's graph node — then announces `entity.merged` so sibling features re-derive what moved (a stage production re-lands its profile and redraws its credits under the survivor). The survivor defaults to the filing's proposed survivor; a `survivor_id` must be one of the two parties. A filing already decided answers 409. **Management plane, staff only** — an authenticated admin USER, never a consumer key.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                survivor_id:
                  type:
                    - string
                    - 'null'
                  format: uuid
                  description: Overrides the proposed survivor; must be a party to the filing.
                note:
                  type:
                    - string
                    - 'null'
                  maxLength: 2000
      responses:
        '200':
          description: The merge as ledgered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMergeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/entities/reviews/{id}/reject:
    post:
      operationId: rejectReviewItem
      tags:
        - Admin
      summary: Close a review filing as rejected (management plane)
      description: |
        The pair stays two entities and the filing is closed with the reviewer's note. **Management plane, staff only.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type:
                    - string
                    - 'null'
                  maxLength: 2000
      responses:
        '200':
          description: The filing as closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      review_item_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - rejected
                    required:
                      - review_item_id
                      - status
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                  - data
                  - error
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/clients:
    post:
      operationId: createConsumerClient
      tags:
        - Admin
      summary: Register a consumer client
      description: |
        Management plane, never part of the consumer data contract. Registers a client with its entitlement scopes; issue a key next via `POST /v1/admin/clients/{id}/keys`. Requires an authenticated admin USER (WorkOS session bearer token, role `admin`) — consumer API keys are always rejected here. Until the auth feature lands the verifier is nil and every deployed environment denies all requests.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Unique display name for the client org.
                scopes:
                  type: array
                  items:
                    type: string
                  description: |
                    Entitlement scopes — data plane only (read:entity, read:person, read:company, read:film_tv, projections:pull, subgraph:read, graph:search, graph:paths, investor_narrative:read, corrections:propose, enrich:company, enrich:person, enrich:film_tv, social_media_insights:company, social_media_insights:person, deep_research:person). Unknown scopes are rejected; management actions are role-guarded and have no scope.
                entitlements:
                  type: object
                  description: |
                    Optional entity-level filter for partial-data deals, e.g. {"entity_types": ["person"]}. Empty = full access within scopes.
                contact_email:
                  type:
                    - string
                    - 'null'
              required:
                - name
      responses:
        '201':
          description: The registered client (no key material).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerClientEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A client with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/clients/{id}/keys:
    post:
      operationId: issueConsumerClientKey
      tags:
        - Admin
      summary: Issue an API key for a client
      description: |
        Management plane. Mints a raw API key, stores only its SHA-256 hash, and returns the raw key ONCE — it cannot be retrieved again, only revoked and replaced. Multiple active keys per client enable zero-downtime rotation: issue new, deploy, revoke old. Requires an authenticated admin user (role `admin`), never a consumer API key.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type:
                    - string
                    - 'null'
                  description: Ops label, e.g. "initial key 2026-07".
                expires_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: Optional expiry; must be in the future.
      responses:
        '201':
          description: The issued key, raw secret included this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedKeyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/keys/{id}/revoke:
    post:
      operationId: revokeConsumerClientKey
      tags:
        - Admin
      summary: Revoke an API key
      description: |
        Management plane. Soft-revokes one key (the row survives for audit); other keys on the same client keep working. Requires an authenticated admin user (role `admin`), never a consumer API key.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revoked (data is null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/persons/social-insights/backfill:
    post:
      operationId: backfillPersonSocialInsights
      tags:
        - Enrichment
      summary: Request social insights for persons whose Deep Bio never chained one (management plane)
      description: |
        A Deep Bio landing now chains a forced social-insights rebuild. Persons researched before that chain existed hold a distilled Deep Bio and no insights; this publishes one forced request per such person. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key, because each request is a paid LLM build (~90s) plus two web searches. One bounded batch per call. Requests are asynchronous, so a person leaves the backlog only once the build lands; calling again inside that window asks for the same people again. A person whose build failed in the last day is skipped so one bad subject is not re-bought on every call. `remaining` is true when the batch filled — call again until it is false.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Persons to request in this batch. Omitted uses the server default (25); values above the server ceiling (200) are clamped.
          schema:
            type: integer
            minimum: 1
        - name: dry_run
          in: query
          required: false
          description: When `true`, counts the backlog and publishes nothing.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The batch result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialInsightsBackfillEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/enrichment/persons/social-insights/persist:
    post:
      operationId: persistPersonSocialInsights
      tags:
        - Enrichment
      summary: Decode stored social-insights payloads into the person_social_insights rows (management plane)
      description: |
        Closes the gap for insights runs that landed before the satellite table existed: for every person whose latest `social_insights` payload has no row, the payload is decoded into one. No LLM call and no provider spend; `model` stays null because the envelope never carried it. **Management plane, staff only** — a WorkOS session with role `admin`. One bounded batch per call; `remaining` is true when the batch filled.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Persons to persist in this batch. Omitted uses the server default (25); values above the server ceiling (200) are clamped.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The batch result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialInsightsPersistEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/agents/deep-bio/sweep:
    post:
      operationId: sweepDeepBioJobs
      tags:
        - Agents
      summary: Re-drive Deep Bio jobs that stopped without settling (management plane)
      description: |
        Picks the research jobs that stalled and asks a worker to run each again. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants this, because a swept job can spend provider credit. Three kinds of row are picked: a `pending` job whose run request was lost, an `error` job whose retry is due, and a `running` job whose lease expired because its worker died. Jobs out of attempts are never picked, so a doomed job stops being swept rather than looping. The case this exists for is a job RELEASED after its envelope landed: it holds a paid, valid payload that nothing else will ever normalize. Sweeping that job usually costs NOTHING, because the runner resumes from the stored envelope instead of re-buying the research. It only REQUESTS runs — it never creates a job, so it cannot spend outside the launch guards (freshness window and daily cap). One bounded batch per call, so an operator watches the counts rather than starting an unbounded drain. A full batch is not a cleared backlog: call again until `picked` is zero.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Jobs to request in this batch. Omitted uses the server default (5, matching the cron's batch size).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: |
            What the sweep asked for. `picked` is what the query returned and `requested` is what was published; a gap means the topic refused and those rows stay picked for the next sweep.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepBioSweepEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/admin/agents/deep-bio/persons/{id}/force:
    post:
      operationId: forceDeepBio
      tags:
        - Agents
      summary: Research one person's Deep Bio again (management plane)
      description: |
        Creates a research job even when the person already has a recent successful one, bypassing the freshness window. **Management plane, staff only** — a WorkOS session with role `admin`, never a consumer API key. There is no scope that grants this: one call buys minutes of web research and tens of thousands of output tokens. The daily spend cap STILL APPLIES. Forcing is for re-running one person, never for getting past the ceiling — a refusal by the cap returns 200 with `outcome: skipped` and a null `job_id`, because nothing went wrong, the answer is no. Single-flight still applies too: a person with a live job gets that job's id back rather than a second one. `requested` is false when the job exists but no worker was asked (the run request failed) — the sweep above collects it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The person entity's canonical id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The job the request resolved to, and what the guards decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepBioForceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Consumer API key issued by the consumers registry.
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature-SHA1
      description: |
        Provider callback plane. Hex-lowercase HMAC-SHA1 of the raw request body, keyed with the API key we call that provider with — so the provider holds no consumer identity and no second secret exists. Verified against the bytes as sent; a re-serialized body has a different digest.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    Error:
      type: object
      properties:
        code:
          type: string
          description: Upper-snake error kind (VALIDATION_FAILED, NOT_FOUND, ...).
        message:
          type: string
        details:
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
      required:
        - code
        - message
    ErrorEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    EmptyEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The canonical (living) entity id. Persist this one.
        requested_id:
          type: string
          format: uuid
          description: The id the caller asked for; differs after a merge.
        entity_type:
          type: string
        display_name:
          type:
            - string
            - 'null'
      required:
        - id
        - requested_id
        - entity_type
        - display_name
    EntityEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Entity'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    ProjectionCompany:
      type: object
      description: The company record. Maps to the consumer's companies table.
      properties:
        name:
          type:
            - string
            - 'null'
        aliases:
          type: array
          items:
            type: string
          description: |
            Every known alias. A consumer storing a single alias takes the first — Universe does not drop the rest at the boundary.
        legal_name:
          type:
            - string
            - 'null'
        logo:
          type:
            - string
            - 'null'
        logo_storage_key:
          type:
            - string
            - 'null'
          description: The object key behind `logo`, when Universe re-hosts it.
        domain:
          type:
            - string
            - 'null'
        alternative_domains:
          type: array
          items:
            type: string
        linkedin_url:
          type:
            - string
            - 'null'
        tagline:
          type:
            - string
            - 'null'
        long_description:
          type:
            - string
            - 'null'
          description: The long-form about text.
        short_description:
          type:
            - string
            - 'null'
          description: The clamped short about text.
        social_insights:
          type: array
          items:
            type: string
          description: Always empty today — insights are not distilled yet.
        founded:
          type:
            - integer
            - 'null'
        is_school:
          type: boolean
        is_vc:
          type: boolean
        employee_range:
          type:
            - string
            - 'null'
        employees_citation:
          type:
            - string
            - 'null'
          description: One sentence naming what was read and the value shown.
        employees_citation_url:
          type:
            - string
            - 'null'
          description: The exact page the range was read from.
        last_enriched:
          type:
            - string
            - 'null'
          format: date-time
        enrichment_status:
          type: string
          enum:
            - seeded
            - enriching
            - complete
            - failed
            - disputed
          description: |
            Where this record is in its lifecycle. `disputed` is distinct from `failed` on purpose: enrichment ran and most of the record is likely correct, but a provider resolved an IDENTITY that contradicts the name we hold, so we no longer know for certain who this record is. Hold a disputed record — do not merge, publish onward, or act on its identity — and tell us: it is frozen on our side until a human reconciles it, and nothing re-enriches it in the meantime. `failed` means enrichment did not produce a usable result at all.
      required:
        - name
        - aliases
        - legal_name
        - logo
        - logo_storage_key
        - domain
        - alternative_domains
        - linkedin_url
        - tagline
        - long_description
        - short_description
        - social_insights
        - founded
        - is_school
        - is_vc
        - employee_range
        - employees_citation
        - employees_citation_url
        - last_enriched
        - enrichment_status
    ProjectionMoney:
      type: object
      description: |
        An amount as the source reported it. value_usd is only ever the source's own USD figure — Universe never converts currencies, so a non-USD amount may carry a null value_usd.
      properties:
        value:
          type:
            - number
            - 'null'
        currency:
          type:
            - string
            - 'null'
        value_usd:
          type:
            - number
            - 'null'
        citation:
          type:
            - string
            - 'null'
        citation_url:
          type:
            - string
            - 'null'
      required:
        - value
        - currency
        - value_usd
    ProjectionFinancials:
      type: object
      description: |
        Maps to the consumer's company_financials table. The fields marked "no source yet" are always null today and are present so the shape does not change when a producer lands.
      properties:
        company_type:
          type:
            - string
            - 'null'
        yc_batch:
          type:
            - string
            - 'null'
        is_public:
          type: boolean
        went_public_on:
          type:
            - string
            - 'null'
          description: ISO date (YYYY-MM-DD).
        ticker:
          type:
            - string
            - 'null'
        primary_exchange:
          type:
            - string
            - 'null'
        stock_link:
          type:
            - string
            - 'null'
        funding_summary:
          type:
            - string
            - 'null'
        funding_total_value_usd:
          type:
            - integer
            - 'null'
        funding_total_currency:
          type:
            - string
            - 'null'
        total_rounds_raised:
          type:
            - integer
            - 'null'
        revenue:
          oneOf:
            - $ref: '#/components/schemas/ProjectionMoney'
            - type: 'null'
        acquired:
          type: boolean
        acquired_by:
          type:
            - string
            - 'null'
        stock_label:
          type:
            - string
            - 'null'
          description: No source yet — always null.
        acquired_by_permalink:
          type:
            - string
            - 'null'
          description: No source yet — always null.
        crunchbase_acquirer_id:
          type:
            - string
            - 'null'
          description: No source yet — always null.
        acquirer_company_id:
          type:
            - string
            - 'null'
          format: uuid
          description: No source yet — always null. Would be a universe entity id.
        acquisition_price:
          oneOf:
            - $ref: '#/components/schemas/ProjectionMoney'
            - type: 'null'
        operating_status:
          type:
            - string
            - 'null'
          description: Distilled from the funding-data mirror (e.g. active, closed).
        ipo_status:
          type:
            - string
            - 'null'
          description: Distilled from the funding-data mirror (e.g. private, public).
      required:
        - company_type
        - yc_batch
        - is_public
        - went_public_on
        - ticker
        - primary_exchange
        - stock_link
        - funding_summary
        - funding_total_value_usd
        - funding_total_currency
        - total_rounds_raised
        - revenue
        - acquired
        - acquired_by
        - stock_label
        - acquired_by_permalink
        - crunchbase_acquirer_id
        - acquirer_company_id
        - acquisition_price
        - operating_status
        - ipo_status
    ProjectionCompanyInvestment:
      type: object
      description: |
        One round the firm invested in. Same rules as ProjectionPersonInvestment without the firm columns: funding_round_id and company_id are null until Universe holds the round or company, external_deal_id always rides, money_raised is the absolute amount shape of companies.funding_rounds, company_logo is Universe's re-hosted logo when held, else the source's.
      properties:
        funding_round_id:
          type:
            - string
            - 'null'
          format: uuid
        external_deal_id:
          type:
            - string
            - 'null'
        funding_type:
          type:
            - string
            - 'null'
        money_raised:
          oneOf:
            - $ref: '#/components/schemas/ProjectionMoney'
            - type: 'null'
        announced_date:
          type:
            - string
            - 'null'
          format: date
        description:
          type:
            - string
            - 'null'
        is_lead_investor:
          type: boolean
        company_id:
          type:
            - string
            - 'null'
          format: uuid
        company_name:
          type: string
        company_logo:
          type:
            - string
            - 'null'
        acquired:
          type: boolean
        ipo_status:
          type:
            - string
            - 'null'
      required:
        - funding_round_id
        - external_deal_id
        - funding_type
        - money_raised
        - announced_date
        - description
        - is_lead_investor
        - company_id
        - company_name
        - company_logo
        - acquired
        - ipo_status
    ProjectionInvestorProfile:
      type: object
      description: |
        Always present. A company with no investor profile gets null FIELDS, never a null object, so the consumer's upsert is unconditional. Maps to investor_company_profile.
      properties:
        exits:
          type:
            - string
            - 'null'
        investment_range:
          type:
            - string
            - 'null'
        investment_sweet_spot:
          type:
            - string
            - 'null'
        investment_stages:
          type:
            - string
            - 'null'
        investments:
          type:
            - string
            - 'null'
          description: Portfolio company names, comma separated, newest deal first.
        llm_investor_summary:
          type:
            - string
            - 'null'
          description: The firm's declared investment thesis, one paragraph.
        active_in_sector:
          type:
            - string
            - 'null'
          description: Sectors the firm invests in, comma separated.
        derived_thesis_summary:
          type:
            - string
            - 'null'
        portfolio_investments:
          type: array
          description: Rounds the firm invested in, newest first, at most 50. Exits are excluded.
          items:
            $ref: '#/components/schemas/ProjectionCompanyInvestment'
        portfolio_exits:
          type: array
          description: |
            DERIVED, not stored: rounds whose company was acquired or went public. Newest first, at most 50.
          items:
            $ref: '#/components/schemas/ProjectionCompanyInvestment'
      required:
        - exits
        - investment_range
        - investment_sweet_spot
        - investment_stages
        - investments
        - llm_investor_summary
        - active_in_sector
        - derived_thesis_summary
        - portfolio_investments
        - portfolio_exits
    ProjectionBanner:
      type: object
      properties:
        url:
          type: string
        storage_key:
          type:
            - string
            - 'null'
          description: |
