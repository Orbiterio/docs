            Subdomain rows held back because their parent domain has no node yet (subdomain kind only; 0 otherwise).
        failed:
          type: array
          items:
            $ref: '#/components/schemas/SeedFailure'
        has_more:
          type: boolean
          description: True when rows remain — run another batch.
      required:
        - kind
        - remaining_before
        - processed
        - created
        - edges_created
        - awaiting_parent
        - failed
        - has_more
    SeedResultEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SeedResult'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    WipeResult:
      type: object
      properties:
        remaining_before:
          type: integer
          description: Non-reference nodes in the graph before this batch.
        nodes_deleted:
          type: integer
        edges_deleted:
          type: integer
        entity_links_cleared:
          type: integer
          description: |
            universe.entities rows whose graph_node_uuid / graph_written_at were nulled.
        address_links_cleared:
          type: integer
          description: |
            universe.master_addresses rows whose graph_written_at was nulled (re-queued for the locations drain).
        round_links_cleared:
          type: integer
          description: |
            universe.funding_rounds rows whose graph_node_uuid / raised_edge_uuid were nulled — see the operation's round caveat before re-materializing deals.
        music_links_cleared:
          type: integer
          description: |
            Music support-node stamps (music_release / music_place graph_node_uuid) plus music_credits and music_support_edges edge_created flags reset, which re-arms the two music replays after a node wipe.
        entities_deleted:
          type: integer
          description: |
            universe.entities rows deleted (targets tables/all); cascade victims are not counted separately.
        rows_deleted:
          type: integer
          description: |
            Explicitly-deleted blocker rows (theses, typed caches, dangling relation facts) for targets tables/all.
        deals_reset:
          type: integer
          description: |
            fundables.deals rows whose processed_at write-marker was cleared (targets tables/all).
        has_more:
          type: boolean
          description: True when nodes remain — run another batch.
      required:
        - remaining_before
        - nodes_deleted
        - edges_deleted
        - entity_links_cleared
        - address_links_cleared
        - round_links_cleared
        - music_links_cleared
        - entities_deleted
        - rows_deleted
        - deals_reset
        - has_more
    WipeResultEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WipeResult'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    Instance:
      type: object
      description: |
        One graph connection-config row. Credentials included by design — the point is to hand back connection details.
      properties:
        id:
          type: integer
          format: int64
        graph_name:
          type: string
        user_name:
          type: string
        password:
          type: string
        host:
          type: string
        port:
          type: string
        db_connection:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - graph_name
        - user_name
        - password
        - host
        - port
        - db_connection
        - created_at
    InstanceListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    InstanceEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Instance'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    ReviewMergeEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            merge_id:
              type: string
              format: uuid
            survivor_id:
              type: string
              format: uuid
            loser_id:
              type: string
              format: uuid
            review_item_id:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - applied
            moved:
              type: object
              description: Rows repointed to the survivor, by table.
              additionalProperties:
                type: integer
            dropped:
