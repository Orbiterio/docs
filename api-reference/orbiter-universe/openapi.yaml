        - error
        - meta
    ConsumerClient:
      type: object
      description: A registered consumer client. Never carries key material.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        entitlements:
          type: object
        contact_email:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - scopes
        - entitlements
        - contact_email
        - created_at
    ConsumerClientEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ConsumerClient'
