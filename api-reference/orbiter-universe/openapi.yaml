    SubgraphNode:
      type: object
      required:
        - id
        - uuid
        - labels
        - is_root
        - properties
      properties:
        id:
          type: integer
          format: int64
          description: |
            Identifies the node within this response only. It means nothing in another graph; consumers merge on uuid.
        uuid:
          type: string
          format: uuid
          description: |
            The node's identity, and what a consumer must merge on. Merge on Entity plus uuid alone and add subtype labels afterwards: merging on the full label set creates a second node under one uuid.
        labels:
          type: array
          items:
            type: string
          example:
            - Entity
            - Person
        is_root:
          type: boolean
          description: True for the requested entity, false for a neighbour.
        properties:
          type: object
          additionalProperties: true
          description: |
            Verbatim node properties, untyped because one field name carries two types across labels: updated_at is a string on Person and an integer on Company, in the same response. Decode into an untyped map, never a typed struct.
            embeddings arrives as an array and must be re-wrapped as a vector on write, or it stays an inert list the vector index never sees and search silently returns nothing. name_embedding is deprecated and should be discarded.
    SubgraphEdge:
      type: object
      required:
        - id
        - type
        - source
        - target
        - direction
        - properties
      properties:
        id:
          type: integer
          format: int64
          description: Identifies the edge within this response only.
        type:
          type: string
          example: WORKS_AT
        source:
          type: string
          format: uuid
          description: The true start node. Never flip it.
        target:
          type: string
          format: uuid
          description: The true end node.
        direction:
          type: string
          enum:
            - out
            - in
          description: Relative to the anchor. Informational only.
        properties:
          type: object
          additionalProperties: true
          description: |
            Verbatim edge properties, untyped for the same reason as nodes: description_generated_at is a string on WORKS_AT and an integer on FOUNDED, in the same response. role_history is an escaped JSON string, not a nested object, and copies across as an opaque value.
            Carries weight, the traversal cost pathfinding ranks on, which a consumer copies rather than recomputes.
    Subgraph:
      type: object
      required:
        - schema_version
        - entity_id
        - requested_id
        - entity_type
        - nodes
        - edges
        - truncated
      properties:
        schema_version:
          type: string
          description: Wire contract version. A breaking change gets a new version, not an edit.
          example: entity_subgraph.v1
        entity_id:
          type: string
          format: uuid
          description: The canonical id after merge resolution, and the anchor node's uuid.
        requested_id:
          type: string
          format: uuid
          description: |
            The id asked for. Differs from entity_id when a merge has moved the entity, so a consumer can heal a stored reference.
        entity_type:
          type: string
          example: person
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SubgraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SubgraphEdge'
        truncated:
          type: boolean
          description: |
            True when limit dropped neighbours. Edges to a dropped node are omitted, so a partial neighbourhood never reads as complete.
    SubgraphEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/Subgraph'
        error:
          type: 'null'
    GraphSearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Natural-language text, embedded server-side. A description of what you are looking for beats a bare keyword.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: |
            Upper bound on matches fetched from the vector index, not a page size: relevance cuts run after it, so fewer nodes may come back.
        include_embeddings:
          type: boolean
          default: true
          description: |
            Vectors dominate the payload at roughly 107KB per node. Turn them off for structure only; keep them if the consumer intends to search its own copy, since they are never regenerated downstream.
        entity_types:
          type: array
          items:
            type: string
          example:
            - person
            - company
          description: |
            Narrows MATCHES to these entity_type values; neighbours are unaffected. Omit for every type the client is entitled to.
    GraphSearchNode:
      type: object
      required:
        - id
        - uuid
        - labels
        - is_match
        - score
        - properties
      properties:
        id:
          type: integer
          format: int64
          description: |
            Identifies the node within this response only. It means nothing in another graph; consumers merge on uuid.
        uuid:
          type: string
          format: uuid
          description: |
            The node's identity, and what a consumer must merge on. For an enrichable entity this is also its Universe entity id, so it is what you pass to the entity, projection and paths endpoints.
        labels:
          type: array
          items:
            type: string
          example:
            - Entity
            - Person
        is_match:
          type: boolean
          description: |
            True for a node the query matched, false for one pulled in by one-hop expansion.
        score:
          type:
            - number
            - 'null'
          description: |
            Vector DISTANCE on a match — lower is closer. Null on a neighbour, which was never scored against the query.
        properties:
          type: object
          additionalProperties: true
          description: |
            Verbatim node properties, untyped for the same reason as the subgraph projection: one field name carries two types across labels. embeddings arrives as an array and must be re-wrapped as a vector on write.
    GraphSearch:
      type: object
      required:
        - schema_version
        - nodes
        - edges
        - truncated
      properties:
        schema_version:
          type: string
          description: Wire contract version. A breaking change gets a new version, not an edit.
          example: graph_search.v1
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphSearchNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SubgraphEdge'
          description: |
            Edges incident to a matched node, in the same shape as the subgraph projection. direction is relative to the matched node.
        truncated:
          type: boolean
          description: |
            True when the neighbour cap dropped nodes. Matched nodes are never dropped, and edges to a dropped node are omitted.
    GraphSearchEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/GraphSearch'
        error:
          type: 'null'
    GraphPathsRequest:
      type: object
      required:
        - source_entity_ids
        - target_entity_id
      properties:
        source_entity_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
          description: |
            Universe entity ids to search from. Each runs its own traversal, which is why the list is capped. The target itself is ignored if included.
        target_entity_id:
          type: string
          format: uuid
          description: Universe entity id to reach. Resolved through the merge chain.
        max_hops:
          type: integer
          minimum: 1
          maximum: 6
          default: 4
          description: |
            Route length ceiling. Past four, a traversal reaches most of the graph through some chain, which is not a connection anyone can act on; cost also grows with depth.
    GraphPathNode:
      type: object
      required:
        - uuid
        - name
        - entity_type
        - labels
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        entity_type:
          type: string
          example: company
        labels:
          type: array
          items:
            type: string
          example:
            - Entity
            - Company
    GraphPathHop:
      type: object
      required:
        - type
        - source
        - target
        - weight
        - description
      properties:
        type:
          type: string
          example: WORKS_AT
        source:
          type: string
          format: uuid
          description: |
            The edge's true start node, which may be the node travelled TO when the route runs against the arrow. Never flip it.
        target:
          type: string
          format: uuid
          description: The edge's true end node.
        weight:
          type: integer
          format: int64
          description: |
            Traversal cost, lower being stronger. 0 when the edge carries no weight.
        description:
          type: string
          description: |
            The edge's description, or its fact when it has no description. Empty when it has neither.
    GraphPath:
      type: object
      required:
        - source_entity_id
        - requested_source_entity_id
        - source_node_uuid
        - hops_count
        - total_weight
        - nodes
        - hops
      properties:
        source_entity_id:
          type: string
          format: uuid
          description: The canonical source id after merge resolution.
        requested_source_entity_id:
          type: string
          format: uuid
          description: |
            The source id asked for, so a consumer can heal a stored reference when a merge has moved it.
        source_node_uuid:
          type: string
          format: uuid
          description: The source's graph node uuid, which the path starts from.
        hops_count:
          type: integer
          description: Number of edges traversed. One less than nodes.
        total_weight:
          type: integer
          format: int64
          description: |
            Sum of the hop weights, where LOWER is stronger: the weight scale is a distance, so paths are ordered ascending.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphPathNode'
          description: |
            The route in order, source first and target last. Named only — full properties come from the subgraph endpoint.
        hops:
          type: array
          items:
            $ref: '#/components/schemas/GraphPathHop'
          description: The edges in order, aligned with consecutive nodes.
    GraphPaths:
      type: object
      required:
        - schema_version
        - target_entity_id
        - requested_target_id
        - max_hops
        - paths
        - unreachable_source_entity_ids
        - skipped_source_entity_ids
      properties:
        schema_version:
          type: string
          description: Wire contract version. A breaking change gets a new version, not an edit.
          example: graph_paths.v1
        target_entity_id:
          type: string
          format: uuid
          description: The canonical target id after merge resolution.
        requested_target_id:
          type: string
          format: uuid
          description: |
            The target id asked for. Differs from target_entity_id when a merge has moved the entity, so a consumer can heal a stored reference.
        max_hops:
          type: integer
          description: The bound actually applied, after defaulting.
        paths:
          type: array
          items:
            $ref: '#/components/schemas/GraphPath'
          description: One path per reachable source, lowest total_weight first.
        unreachable_source_entity_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Sources that were searched and have no route within max_hops, in request order.
        skipped_source_entity_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Sources that could not be searched at all: unknown to Universe, not yet written to the graph, or the target itself. Held apart from unreachable, which means searched and not found.
    GraphPathsEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          $ref: '#/components/schemas/GraphPaths'
        error:
          type: 'null'
    GetAddCompanyRequest:
      type: object
      description: |
        The 17-field seed contract. Legacy integer fields (data_source_id) are accepted for caller compatibility and ignored.
      properties:
        domain:
          type: string
          description: Bare host preferred; URL-shaped values are discarded.
        profile_url:
          type: string
          description: |
            Company profile URL (LinkedIn company/school page or Crunchbase organization page). /school/ URLs are preserved.
        company_name:
          type: string
          description: Hint only — never used to match or create by itself.
        musicbrainz_url:
          type: string
          description: |
            The label's MusicBrainz page, or a bare mbid. A MusicBrainz label IS a company (D-2), so this is the same door as a domain — and it is identity EVIDENCE, not a hint: an mbid is a strong key, so it satisfies the identity guard where a company name alone never can, letting a label be created from its page with no website.
        source:
          type: string
          description: Canonical source string recorded on the entity.
        data_source_id:
          type: integer
          description: Legacy; accepted and ignored.
        is_vc:
          type:
            - boolean
            - 'null'
          description: Hint only; VC status is derived from evidence.
        is_school:
          type: boolean
          description: Escalate-only; triggers the school-input guard.
        queue:
          type: boolean
          description: Forces the queue path instead of async dispatch.
        hold_downstream:
          type: boolean
          description: Suppresses both dispatch and queueing.
        return_fast:
          type: boolean
          description: Skips the synchronous LLM preflight only.
        lookup_only:
          type: boolean
          description: Match-only; a miss returns the miss shell.
        allow_create:
          type:
            - boolean
            - 'null'
          description: |
            Defaults true. Explicit false is lookup-only; explicit true unlocks the controlled work-history queue exception.
        cascade_depth:
          type: integer
          description: 0 = seed (async dispatch); >0 = leaf (queued).
        priority_tier:
          type:
            - integer
            - 'null'
          description: |
            Absent means tier **0**: a direct request outranks anything a cascade discovered, and the timed drain only picks `priority_tier <= 1`. Pass an explicit value to override, including a higher number to deprioritise a bulk import.
        source_function:
          type: string
          description: Trace metadata + fan-out governor key.
        source_entity_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: Originating entity, persisted to the queue.
        source_entity_type:
          type: string
        seeded_by_user:
          type:
            - integer
            - 'null'
          description: Observability only.
        force:
          type: boolean
          description: |
            Re-runs providers past the fetch-once/debounce gates on the dispatched run (spend). Eligibility gates and write policies are never bypassed; ignored on queued and lookup-only paths.
    ProjectionStatus:
      type: object
      description: |
        Whether the consumer package rode along on this get-add and, when it did not, which gate stopped it. Always present, including when `projection` is null.
        The response status is always 200 — a resolved entity is not an error. `class` is an HTTP-SHAPED CLASS for the projection field alone, so a client can branch without knowing every slug: 200 you have it, 202 it is coming, 4xx this call will not give it to you.
        `poll` is DERIVED from `code`; a client that reads only `poll` is never wrong about whether to come back.
        A repeat get-add of an already enriched person answers `200:available` from what we hold and dispatches no run inside the server's re-run window (24h by default) unless `force` is sent. While a run IS still settling the code is `202:enriching`; `409:unsatisfied` is reserved for a run that settled with a failed clause.
        The two `disputed` codes are the pair to handle deliberately. They mean a provider resolved an IDENTITY that contradicts the name we hold, so we no longer know for certain who the record describes. `200:disputed` still carries the package — most of it is likely correct, only the identity is in doubt, so hold the record rather than discard it and do not act on its identity; `409:disputed` means there is no package to send. Both are `poll: false`: the record is frozen on our side and no further run will revisit it until a human reconciles it, so re-reading never changes the answer. Tell us instead.
      properties:
        code:
          type: string
          enum:
            - 200:available
            - 200:stale
            - 200:disputed
            - 202:created
            - 202:queued
            - 202:enriching
            - 202:identity_resolving
            - 403:no_permission
            - 403:not_entitled
            - 404:no_entity
            - 404:never_enriched
            - 409:not_distilled
            - 409:unsatisfied
            - 409:disputed
            - 422:unsupported_entity_type
        class:
          type: integer
          enum:
            - 200
            - 202
            - 403
            - 404
            - 409
            - 422
        poll:
          type: boolean
        detail:
          type: string
          description: One human sentence. For logs, never for branching.
      required:
        - code
        - class
        - poll
        - detail
    CompanyShell:
      type: object
      description: |
        Returned populated on found/created branches, null-fielded on misses. company_created is true only on a fresh create.
      properties:
        company_created:
          type: boolean
        master_company_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Universe entity UUID (canonical id).
        node_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Graph node uuid; populated on creates unless the graph was unavailable (backfilled later).
        company_name:
          type:
            - string
            - 'null'
        company_domain:
          type:
            - string
            - 'null'
        permalink:
          type:
            - string
            - 'null'
          description: Reserved; always null today.
        linkedin_url:
          type:
            - string
            - 'null'
        projection:
          oneOf:
            - $ref: '#/components/schemas/CompanyProjection'
            - type: 'null'
          description: |
            The company_projection.v1 package, byte-identical to GET /v1/entities/{id}/projection — one schema, two doors.
            Present only when ALL of: the company already existed (`company_created: false`), it is publishable, and the caller holds `projections:pull` plus the entity-type entitlement. Null otherwise, with the reason in `projection_status`.
        projection_status:
          $ref: '#/components/schemas/ProjectionStatus'
      required:
        - company_created
        - master_company_id
        - node_uuid
        - company_name
        - company_domain
        - permalink
        - projection
        - projection_status
        - linkedin_url
    CompanyShellEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyShell'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
    GetAddPersonRequest:
      type: object
      description: |
        The #13039 seed contract.
        Six fields were removed on 2026-08-28. `phone_region` went because `phone_numbers` must be E.164 — the country comes off the `+`, and the hint could only ever have affected a number sent without one. The other five because nothing read them: `user_id`, `data_source`, the integer `source_entity_id`, `orbiter_verified`, and `is_c_suite` (which the company handoff writes internally, never a caller).
        Sending any of them is still harmless — unknown keys are ignored, not rejected — so no integrator needs to change.
      properties:
        full_name:
          type: string
          description: |
            Split deterministically into first/middle/last. A provider-supplied name wins over this one.
            When `first_name`, `middle_name` or `last_name` are also sent, this still wins as the display name — so a prefix and suffix ("Dr. ... , MD") survive — while the parts win as the parts.
        first_name:
          type: string
          description: |
            The caller's own split, for a name whose structure a string does not carry. Sending ANY of `first_name`, `middle_name` or `last_name` makes the caller authoritative about ALL THREE: the deterministic split of `full_name` is discarded for these fields, never merged field-by-field, because omitting `middle_name` is an assertion that there is none.
            Use these when the form already knows the structure. `full_name` alone cannot express a Han/Hangul/Kana name (the split yields no parts), a Hispanic or Portuguese double surname (the whole tail lands in `last_name`), or a four-token name (its middle tokens appear in no part). Omit them and nothing changes — a provider that only has a full name keeps sending just `full_name`.
        middle_name:
          type: string
          description: See `first_name`. Omitting it asserts there is no middle name.
        last_name:
          type: string
          description: See `first_name`. May be multi-word ("Rodriguez Garcia", "El Khoury").
        linkedin_url:
          type: string
          description: |
            The person's own `linkedin.com/in` profile, and the primary identity key of the whole provider ladder. Its own field because it is a DATA SOURCE, not context.
            Canonicalized before use, so casing, `www.`, a trailing slash and a regional host (`br.linkedin.com`) all resolve to one key. A URL that is not a `/in/` profile is refused rather than keyed — a `/company/` page or an `x.com` link here would make a Twitter handle somebody's identity.
        imdb_url:
          type: string
          description: |
            The person's IMDb name page, or a bare `nm`-id. The KIND is checked: a `/title/` url is refused rather than keying a person onto a film. Either form stores the bare id.
        musicbrainz_url:
          type: string
          description: |
            The artist's MusicBrainz page, or a bare mbid, for a caller who already knows it. A MusicBrainz person artist IS a person (D-2). The KIND is checked — a release-group id here would key a person on an album.
        email:
          type: array
          items:
            type: string
          description: |
            Lowercased and deduped. Drives the identity ladder; a non-role-local address is a strong key for a person.
        links:
          type: array
          items:
            type: string
          description: |
            **Context and search**: x.com, Instagram, a personal site — the things that describe a persona rather than key it.
            The three DATA SOURCE urls each have their own field (`linkedin_url`, `imdb_url`, `musicbrainz_url`) and belong there. An identity URL found here is still honoured as a fallback, so a caller that puts everything in `links` keeps working; the dedicated field wins when both are given.
        phone_numbers:
          type: array
          items:
            type: string
          description: |
            **Send E.164, with the country code** (e.g. "+254758828399"). The country is read off the `+` itself, so no region hint is needed or accepted.
            A number WITHOUT a country code is stored as evidence and never becomes an identifier — guessing a country would fuse two unrelated people. Punctuation and spacing are stripped, and duplicates collapse on the normalized form.
        company_name:
          type: string
          description: Employer hint; read by the orchestrator, not the gate.
        title:
          type: string
          description: Role hint; read by the orchestrator, not the gate.
        source:
          type: string
          description: |
            Business attribution recorded on contact rows (e.g. "User Input", "Hubspot"). Provider-discovered rows carry the provider's own name instead.
        queue:
          type: boolean
          description: Forces the queue path instead of async dispatch.
        deep_research:
          type: boolean
          description: |
            Requests the agentic bio tier; OR-promoted on the queue row, so it is never cleared by a later request that omits it.
        cascade_depth:
          type: integer
          description: |
            0 = seed (providers run, async dispatch); >0 = leaf (no provider spend, queued) so one seed cannot start a wave.
        priority_tier:
          type:
            - integer
            - 'null'
          description: |
            Absent means tier **0**: a direct request outranks anything a cascade discovered, and the timed drain only picks `priority_tier <= 1`. Pass an explicit value to override, including a higher number to deprioritise a bulk import.
        hold_downstream:
          type: boolean
          description: Suppresses both dispatch and queueing.
        source_function:
          type: string
        source_entity_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: Discovery provenance, persisted to the queue row.
        source_entity_type:
          type: string
        force:
          type: boolean
          description: |
            Re-runs providers past the debounce on the dispatched run; never rides a queue row.
    PersonShell:
      type: object
      description: |
        Returned populated on found/created branches, null-fielded on misses. person_created is true only on a fresh create.
      properties:
        person_created:
          type: boolean
        master_person_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Universe entity UUID (canonical id).
        node_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Graph node uuid; populated on creates unless the graph was unavailable (backfilled later).
        full_name:
          type:
            - string
            - 'null'
          description: |
            A temp_-prefixed value means no source produced a name yet; it is repaired later and must not be displayed.
        linkedin_url:
          type:
            - string
            - 'null'
          description: |
            Identity-grade only — an unverified research candidate is never returned here.
        match_via:
          type:
            - string
            - 'null'
          description: |
            Which key resolved an existing person (linkedin, email, phone, pdl, fundable); null on a create.
        fiber_deferred:
          type: boolean
          description: |
            Identity is still resolving in a background run. Enrichment has not been dispatched yet and fires when the run settles.
        imdb_url:
          type:
            - string
            - 'null'
          description: |
            The canonical IMDb name page, when the person carries an imdb key. Canonical, not the URL you sent — that is how you learn two variants are one person. Null when they have no imdb key.
        emails:
          type: array
          items:
            type: string
          description: |
            The contact emails the person NOW HOLDS — lowercased, deduped, and including any a provider contributed. NOT an echo of what you sent: the same contract as `linkedin_url` and `imdb_url`, so sending one address and getting three back tells you the person already held two. `[]` when we hold none.
        phone_numbers:
          type: array
          items:
            type: string
          description: |
            The stored phone numbers in E.164, on the same terms as `emails`. `[]` when we hold none.
        projection:
          oneOf:
            - $ref: '#/components/schemas/PersonProjection'
            - type: 'null'
          description: |
            The person_projection.v1 package, byte-identical to GET /v1/entities/{id}/projection — one schema, two doors.
            Present only when ALL of: the person already existed (`person_created: false`), they are publishable, and the caller holds `projections:pull` plus the entity-type entitlement. Null otherwise, with the reason in `projection_status`.
        projection_status:
          $ref: '#/components/schemas/ProjectionStatus'
      required:
        - person_created
        - master_person_id
        - node_uuid
        - full_name
        - emails
        - phone_numbers
        - linkedin_url
        - match_via
        - fiber_deferred
        - imdb_url
        - projection
        - projection_status
    PersonShellEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PersonShell'
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - error
        - meta
