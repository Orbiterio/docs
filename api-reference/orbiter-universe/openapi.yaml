  /v1/admin/donors/edge-sweep:
    post:
      operationId: donorsEdgeSweep
      tags:
        - Donors
      summary: Run one bounded DONOR_TO reconciliation pass (management plane)
      description: |
        Draws every pending ledger row the graph does not hold at its current revision, when it may: the donor's `donor_to` fact is CHOSEN for the recipient and both endpoints have nodes. Anything else stays pending. Like the worker's sweep, it does nothing while `ENRICHMENT_DONORS_EDGE_WRITES_ENABLED` is false.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 200
      responses:
        '200':
          description: What the pass did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                      - written
                      - pending
                      - skipped
                    properties:
                      written:
                        type: integer
                      pending:
                        type: integer
                        description: No chosen fact yet, or a node missing.
                      skipped:
                        type: integer
                        description: The aggregate moved under the write; the row stays pending.
                  error:
                    type: 'null'
                  meta:
                    type:
                      - object
                      - 'null'
                required:
                  - data
                  - error
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/seed/locations:
    post:
      operationId: seedGraphLocations
      tags:
        - Graph
      summary: Run one bounded batch of geography node creation
      description: |
        Operator-only. `kind=country` MERGEs `Country:Entity` nodes; `kind=region` MERGEs `Region:Entity` nodes plus their `IN_COUNTRY` edge; `kind=city` MERGEs `City:Entity` nodes plus `IN_REGION` (or `IN_COUNTRY` for region-less cities). Rows whose parent node is missing are held back (`awaiting_parent`) and picked up on a later run — seed countries, then regions, then cities, re-running each while `has_more` is true. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - country
                    - region
                    - city
                limit:
                  type: integer
                  description: Rows per batch (default 15, max 100).
              required:
                - kind
      responses:
        '200':
          description: Batch summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/seed/expertise:
    post:
      operationId: seedGraphExpertise
      tags:
        - Graph
      summary: Run one bounded batch of expertise taxonomy node creation
      description: |
        Operator-only. `kind=domain` creates `DomainExpertise:Entity` nodes; `kind=subdomain` creates `SubDomainExpertise:Entity` nodes plus `HAS_SUBDOMAIN` edges. Subdomains whose parent domain has no node yet are held back (reported as `awaiting_parent`) and picked up on a later run. Seed domains to exhaustion before subdomains. Re-run while `has_more` is true. Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - domain
                    - subdomain
                limit:
                  type: integer
                  description: Rows per batch (default 15, max 100).
              required:
                - kind
      responses:
        '200':
          description: Batch summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/indexes/ensure:
    post:
      operationId: ensureGraphVectorIndexes
      tags:
        - Graph
      summary: Create the graph's vector indexes when absent
      description: |
        Operator-only, idempotent. Creates the Entity vector indexes (`embeddings` for consumer search, `expert_embeddings` for the SPECIALIZES_IN rebuild) at the embedder's width with cosine similarity. An index the graph already holds is left alone, never dropped and rebuilt.
        Needed because FalkorDB errors rather than falling back to a scan when a queried vector index is missing, so a graph without them fails every vector read. The API also runs this at boot; this route is how a graph created later, or one whose index was dropped, is repaired without a redeploy.
        Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One entry per index, with created=false when it was already there.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - label
                        - property
                        - dimensions
                        - created
                      properties:
                        label:
                          type: string
                          example: Entity
                        property:
                          type: string
                          example: embeddings
                        dimensions:
                          type: integer
                          example: 1536
                        created:
                          type: boolean
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/backfill/graph/wipe:
    post:
      operationId: wipeGraph
      tags:
        - Graph
      summary: Wipe enrichment-created graph nodes and/or table rows
      description: |
        Operator-only, DESTRUCTIVE. `target` selects what dies — `nodes` (default): one bounded batch of nodes whose labels are outside the reference keep-set (Country, Region, City, DomainExpertise, SubDomainExpertise) — or, with `entity_type`, only that scope's labels (company = Company + Funding_Round; person = Person + its credential nodes Work, Certification, Honor; film_tv = Film_TV + Film_TV_Award; music = Music_Group, Release_Group, Recording, Music_Work, Event plus the Release and Place support nodes; company and person also take the InvestmentThesis nodes their investors own, selected through the HAS_INVESTMENT_THESIS edge because the thesis label is shared) — plus the write-back ledgers nulled (entities graph_node_uuid / graph_written_at, entity_addresses graph_written_at, funding_rounds graph_node_uuid / raised_edge_uuid) so replay rebuilds them; round caveat: with rows kept, cleared round uuids require a table-side reset before deals reprocess or duplicates land. `tables`: one-transaction delete of enrichment-written ROWS — theses, typed caches, entities and every ON DELETE CASCADE dependent (identifiers, facts, payloads, attempts, queue, satellites, dates, rounds, profiles) — plus fundables.deals.processed_at reset so the fanout re-materializes rounds (mirror data itself untouched); no graph calls. `all`: tables first, then a node batch. Seeded reference rows and nodes always survive. Do not run while enrichment/queue drain is active. Requires `confirm: true`; re-run while `has_more` is true (node batches; table wipes are one-shot). Requires an authenticated admin user (role `admin`); consumer API keys are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  const: true
                  description: Must be true — guards against stray POSTs.
                limit:
                  type: integer
                  description: |
                    Nodes per batch (default 1000, max 10000). CLAMPED, not rejected: a value at or below zero becomes the default and one above the max becomes the max, so no limit is ever a validation failure.
                entity_type:
                  type: string
                  enum:
                    - company
                    - person
                    - film_tv
                    - music
                    - stage_production
                    - video_game
                  description: |
                    Optional scope; omit to wipe every non-reference node. `music` is an umbrella — it covers all five music entity types (music_group, music_release_group, music_recording, music_work, music_event) plus the music_release / music_place support rows and the artist / label satellite profiles, because they are one pipeline. `video_game` is the other: the six game-family types (video_game, game_series, game_platform, game_engine, game_release, game_award) and their nodes, plus the lane's own rows — every root with its jobs, demands, retained source records, the negative cache — so the next person run rebuilds the games from scratch. People and companies the games link to are never touched.
                target:
                  type: string
                  enum:
                    - nodes
                    - tables
                    - all
                  description: |
                    What dies; OPTIONAL, and omitted means `nodes`. Unlike `/graph/purge-entity`, where a target is required: that call names one live row, this one is scoped and batched.
              required:
                - confirm
      responses:
